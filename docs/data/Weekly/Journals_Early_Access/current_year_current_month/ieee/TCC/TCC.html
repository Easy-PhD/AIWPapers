<h2 id="tcc">TCC - 2</h2>
<ul>
<li><details>
<summary>
(2025). Transfer learning-enabled system for drone medicine delivery based on spatio-temporal remote sensing data in edge cloud networks. <em>TCC</em>, 1--13. (<a href='https://doi.org/10.1109/TCC.2025.3639073'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {These days, satellite remote sensing data is employed for different drone applications. The main goal is to provide imaginary information about electromagnetic locations and patterns of geolocations insight into Earth. The Internet of Drone Things (IoDT) exploits remote sensing data to deliver medicine from source to destination. However, many existing medicine delivery systems based on drones need longer execution times and more efficiency in delivering medicine to the right destinations. This paper presents transfer learning, which empowers a spatiotemporal remote sensing data training system for medicine delivery in edge cloud networks based on IoDT applications. The objective is to deliver the medicine to the original destination with the highest score and process all drone tasks based on their given deadlines. We present the offloading spatiotemporal training and scheduling (OSPTS) algorithm methodology that completes the data collection process and medicine delivery in different locations. Therefore, we solve the problem as a combinatorial problem and find the optimal solution based on searching and convolutional neural networks (CNN). Transfer learning and convolutional neural networks are sub-schemes of the OSPTS that train the remote sensing data on edge nodes and point clouds for optimal medicine delivery. Simulation results show that the OSPTS obtained the highest score for medicine delivery in the correct position with less processing time than existing systems.},
  archive      = {J_TCC},
  author       = {Abdullah Lakhan and Tor-Morten Grønli and Ahmet Soylu and Ghulam Muhammad and Qurat-ul-ain Mastoi and Huaming Wu},
  doi          = {10.1109/TCC.2025.3639073},
  journal      = {IEEE Transactions on Cloud Computing},
  month        = {12},
  pages        = {1--13},
  shortjournal = {IEEE Trans. Cloud Comput.},
  title        = {Transfer learning-enabled system for drone medicine delivery based on spatio-temporal remote sensing data in edge cloud networks},
  year         = {2025},
}
</textarea>
</details></li>
<li><details>
<summary>
(2025). CRTSE: Clustering and reinforcement learning based task scheduling algorithm for edge computing. <em>TCC</em>, 1--18. (<a href='https://doi.org/10.1109/TCC.2025.3640958'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Edge computing can overcome many shortcomings of traditional cloud computing and provide high quality computing services. However, it need to face the challenges of node heterogeneity and task diversity, which leads to the performance of edge computing systems relying on proper task scheduling. Existing task scheduling algorithms are usually designed based on mathematical models that are closely related to the internal details of edge computing systems, resulting in poor universality and limited quality of scheduling decisions. In this paper, we address these issues by proposing a Clustering and Reinforcement Learning Based Task Scheduling Algorithm for Edge Computing (CRTSE), which aims to shorten the task processing time and improve the energy efficiency of the system. The algorithm uses Adaptive Graph Auto-Encoder (AdaGAE) based clustering algorithm to cluster computing tasks and classify the computing tasks submitted to the edge computing system based on the clustering results. When making scheduling decisions, an independent deep reinforcement learning model is used for each class of computing tasks to obtain targeted scheduling preference information, and the scheduling decision is made based on these preference information. CRTSE possesses good universality due to the feature of not relying on mathematical models that are closely related to the internal details of edge computing systems, and has the ability to adapt well to diverse computing tasks and to learn continuously during the interaction with the system. Simulation experiments based on real data show that CRTSE can shorten the average task processing time of the edge computing system by up to 56.00% and reduce the average energy consumption of the edge computing system by up to 16.10% compared to existing excellent scheduling algorithms.},
  archive      = {J_TCC},
  author       = {Haoyu Liu and Le Tian and Maozu Guo},
  doi          = {10.1109/TCC.2025.3640958},
  journal      = {IEEE Transactions on Cloud Computing},
  month        = {12},
  pages        = {1--18},
  shortjournal = {IEEE Trans. Cloud Comput.},
  title        = {CRTSE: Clustering and reinforcement learning based task scheduling algorithm for edge computing},
  year         = {2025},
}
</textarea>
</details></li>
</ul>
