(2025). Cooperative perception for automated driving: A survey of algorithms, applications, and future directions. <em>PIEEE</em>, 1-27. (<a href='https://doi.org/10.1109/JPROC.2025.3608874'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Cooperative perception (CP) has emerged as an important research topic in connected and automated transportation systems, significantly enhancing situational awareness in challenging conditions such as limited communication bandwidth, harsh weather, and poor lighting. By sharing and aggregating data from multiple sources—including vehicles, roadside units (RSUs), and other infrastructure—CP addresses critical issues like occlusion and long-range perception in complex environments. This article provides a comprehensive review of existing CP methodologies, evaluating their effectiveness across diverse scenarios and fusion layers. We investigate approaches ranging from early to late collaboration strategies, highlighting how multimodal sensing at the network level can improve detection accuracy, system robustness, and adaptability. Additionally, we review publicly available datasets, identifying key gaps in their coverage of heterogeneous sensors, adverse conditions, and large-scale spatial scenarios. Finally, we propose actionable future research directions, including advanced algorithms for adverse environments, adaptive fusion strategies for heterogeneous sensors, and the integration of emerging technologies such as high-definition (HD) maps, large language models (LLMs), and end-to-end frameworks. These advancements aim to ensure reliability, interoperability, and scalability for real-world connected and automated vehicle (CAV) applications.},
  archive      = {J_PIEEE},
  author       = {Chuheng Wei and Guoyuan Wu and Matthew J. Barth},
  doi          = {10.1109/JPROC.2025.3608874},
  journal      = {Proceedings of the IEEE},
  month        = {10},
  pages        = {1-27},
  shortjournal = {Proc. IEEE},
  title        = {Cooperative perception for automated driving: A survey of algorithms, applications, and future directions},
  year         = {2025},
}
</textarea>
</details></li>
<li><details>
<summary>
(2025). Field-programmable gate array architecture for deep learning: Survey and future directions. <em>PIEEE</em>, 1-27. (<a href='https://doi.org/10.1109/JPROC.2025.3623023'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Deep learning (DL) is becoming the cornerstone of numerous applications both in large-scale datacenters and at the edge. Specialized hardware is often necessary to meet the performance requirements of state-of-the-art DL models, but the rapid pace of change in DL models and the wide variety of systems integrating DL make it impossible to create custom computer chips for all but the largest markets. Field-programmable gate arrays (FPGAs) present a unique blend of reprogrammability and direct hardware execution that make them suitable for accelerating DL inference. They offer the ability to customize processing pipelines and memory hierarchies to achieve lower latency and higher energy efficiency compared to general-purpose central processing units (CPUs) and graphics processing units (GPUs), at a fraction of the development time and cost of custom chips. Their diverse and high-speed inputs/outputs (IOs) also enable directly interfacing the FPGA to the network and/or a variety of external sensors, making them suitable for both datacenter and edge use cases. As DL has become an ever more important workload, FPGA architectures are evolving to enable higher DL performance. In this article, we survey both academic and industrial FPGA chip architecture enhancements for DL. First, we give a brief introduction on the basics of FPGA architecture and how its components lead to strengths and weaknesses for DL applications. Next, we discuss different design styles of DL inference accelerators implemented on FPGAs that achieve state-of-the-art performance and productive development flows, ranging from model-specific dataflow styles to software-programmable overlay styles. We survey DL-specific enhancements to traditional FPGA building blocks including the logic blocks (LBs), arithmetic circuitry, and on-chip memories, as well as new DL-specialized blocks that integrate into the FPGA fabric to accelerate tensor computations. Finally, we discuss hybrid devices that combine processors and coarse-grained accelerator blocks with FPGA-like interconnect and networks-on-chip (NoCs), and highlight promising future research directions.},
  archive      = {J_PIEEE},
  author       = {Andrew Boutros and Aman Arora and Vaughn Betz},
  doi          = {10.1109/JPROC.2025.3623023},
  journal      = {Proceedings of the IEEE},
  month        = {10},
  pages        = {1-27},
  shortjournal = {Proc. IEEE},
  title        = {Field-programmable gate array architecture for deep learning: Survey and future directions},
  year         = {2025},
}
</textarea>
</details></li>
</ul>
