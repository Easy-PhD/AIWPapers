<li><details>
<summary>
(2025). A comprehensive survey on self-interpretable neural networks. <em>PIEEE</em>, 1--31. (<a href='https://doi.org/10.1109/JPROC.2025.3635153'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Neural networks have achieved remarkable success across various fields. However, the lack of interpretability limits their practical use, particularly in critical decision-making scenarios. Posthoc interpretability, which provides explanations for pretrained models, is often at risk of fidelity and robustness. This has inspired a rising interest in self-interpretable neural networks (SINNs), which inherently reveal the prediction rationale through model structures. Despite this progress, existing research remains fragmented, relying on intuitive designs tailored to specific tasks. To bridge these efforts and foster a unified framework, we first collect and review existing works on SINNs and provide a structured summary of their methodologies from five key perspectives: attribution-based, function-based, concept-based, prototype-based, and rule-based self-interpretation. We also present concrete, visualized examples of model explanations and discuss their applicability across diverse scenarios, including image, text, graph data, and deep reinforcement learning (DRL). Additionally, we summarize existing evaluation metrics for self-interpretation and identify open challenges in this field, offering insights for future research. To support ongoing developments, we present a publicly accessible resource to track advancements in this domain: https://github.com/yangji721/Awesome-Self-Interpretable-Neural-Network},
  archive      = {J_PIEEE},
  author       = {Yang Ji and Ying Sun and Yuting Zhang and Zhigaoyuan Wang and Yuanxin Zhuang and Zheng Gong and Dazhong Shen and Chuan Qin and Hengshu Zhu and Hui Xiong},
  doi          = {10.1109/JPROC.2025.3635153},
  journal      = {Proceedings of the IEEE},
  month        = {12},
  pages        = {1--31},
  shortjournal = {Proc. IEEE},
  title        = {A comprehensive survey on self-interpretable neural networks},
  year         = {2025},
}
</textarea>
</details></li>
<li><details>
<summary>
(2025). Hybrid deep learning models for remote sensing image processing. <em>PIEEE</em>, 1--21. (<a href='https://doi.org/10.1109/JPROC.2025.3638871'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Core image processing tasks, such as super-resolution, denoising, deblurring, pansharpening, and atmospheric correction, underpin all optical remote sensing (RS) pipelines. Errors at this stage propagate through downstream applications, distorting land-cover maps, change detection, and climate records. Classical physics-based models capture sensor optics, radiometry, and geometry but struggle with complex noise and scene variability. In contrast, deep learning (DL) methods offer powerful data-driven solutions yet often act as closed boxes, ignoring physical constraints and overfitting to spurious patterns. Hybrid DL (HDL) approaches bridge this gap by integrating physical models with neural architectures, combining interpretability and data adaptivity. This article surveys the emerging landscape of HDL methods in RS image processing, outlining their theoretical foundations, motivations, and design philosophies. We categorize fusion strategies, from model-embedded schemes (e.g., plug-and-play (PnP) and unrolling) to model-guided learning (e.g., deep image prior (DIP) and unsupervised frameworks), and discuss how they enhance trust, robustness, and physical consistency in RS image analysis.},
  archive      = {J_PIEEE},
  author       = {Matthieu Muller and Daniele Picone and Begüm Demir and Gustau Camps-Valls and Mauro Dalla Mura and Magnús Örn Úlfarsson and Jón Atli Benediktsson},
  doi          = {10.1109/JPROC.2025.3638871},
  journal      = {Proceedings of the IEEE},
  month        = {12},
  pages        = {1--21},
  shortjournal = {Proc. IEEE},
  title        = {Hybrid deep learning models for remote sensing image processing},
  year         = {2025},
}
</textarea>
</details></li>
