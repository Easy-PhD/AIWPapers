<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {An open problem in autonomous driving research is modeling human driving behavior, which is needed for the planning component of the autonomy stack, safety validation through traffic simulation (TS), and causal inference for generating explanations for autonomous driving. Modeling human driving behavior is challenging because it is stochastic, high-dimensional, and involves interaction between multiple agents. This problem has been studied in various communities with a vast body of the literature. Existing reviews have generally focused on one aspect: motion prediction (MP). In this article, we present a unification of the literature that covers intent estimation, trait estimation (TE), and motion prediction. This unification is enabled by modeling multiagent driving as a partially observable stochastic game (POSG), which allows us to cast driver modeling tasks as inference problems. We classify driver models into a taxonomy based on the specific tasks they address and the key attributes of their approach. Finally, we identify open research opportunities in the field of driver modeling.},
  archive      = {J_PIEEE},
