(2025). NeoDavid: A humanoid robot with variable-stiffness actuation and dexterous manipulation skills. <em>MRA</em>, 2--17. (<a href='https://doi.org/10.1109/MRA.2025.3599706'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Dexterity and strength are essential for performing a variety of tasks in the unstructured environments of household services and craftsmanship. For these tasks, we have developed neoDavid, a robust humanoid robot with dexterous manipulation skills. neoDavid has joints with variable-stiffness actuators (VSAs), which have mechanically adjustable elasticity in the drive train, a continuum elastic neck, and a gravitationally compensated torso with overload couplings. We present our modular approach in the development, starting from system architecture over mechatronic components, communication, and control to higher-level software. We demonstrate how this modularity enables scalable enhancements, allowing us to evolve the system from a single arm and hand into a complete humanoid robot. Additionally, we highlight advancements in perception, manipulation, and motion planning, along with the implementation of offline task planning utilizing capability maps. The versatile character in terms of dexterity and robustness is demonstrated in challenging applications, e.g., handling a drill hammer, fine manipulation of a pipette, and emptying a dishwasher.},
  archive      = {J_MRA},
  author       = {Sebastian Wolf and Thomas Bahls and Bastian Deutschmann and Alexander Dietrich and Marie Harder and Hannes Höppner and Cynthia Hofmann and Ana Huezo Martin and Manuel Keppler and Leonard Klüpfel and Henry Maurenbrecher and Xuming Meng and Anne E. Reichert and Manuel Stoiber and Markus Bihler and Maxime Chalon and Oliver Eiberger and Werner Friedl and Markus Grebenstein and Maged Iskandar and Viktor Langofer and Martin Pfanne and Antonin Raffin and Jens Reinecke and Tilo Wüsthoff and Alin Albu-Schäffer},
  doi          = {10.1109/MRA.2025.3599706},
  journal      = {IEEE Robotics & Automation Magazine},
  month        = {12},
  pages        = {2--17},
  shortjournal = {IEEE Robot. Autom. Mag.},
  title        = {NeoDavid: A humanoid robot with variable-stiffness actuation and dexterous manipulation skills},
  year         = {2025},
}
</textarea>

<li><details>
<summary>
(2025). A reproducible benchmarking methodology to assess robotic locomotion over irregular terrains: A practical and scalable approach. <em>MRA</em>, 2--12. (<a href='https://doi.org/10.1109/MRA.2025.3631570'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Demonstrating robust and reliable locomotion in real-world environments is essential for validating the performance and safety of legged robots. However, the absence of standardized evaluation frameworks makes it difficult to objectively assess and compare robotic systems under realistic conditions. To address this gap, we propose a comprehensive benchmarking methodology specifically designed for evaluating legged locomotion over irregular and sloped terrains. The framework comprises a modular and easily replicable testbed, a standardized experimental protocol, and a set of performance indicators (PIs) that capture key locomotion metrics such as stability, efficiency, and trajectory accuracy. To demonstrate the utility and applicability of the proposed methodology, we present a case study using the quadruped robot ANYmal-C. We benchmarked its locomotion performance across three different ground materials—flat wood, artificial grass, and TerraSensa—at slope inclinations ranging from 0° to 15°, under two controller configurations (Trekker and Dynamic Gait) and two commanded speeds (0.3 m/s and 0.8 m/s). The results consistently highlight the superior performance of the Trekker controller across all test conditions. Additionally, ground inclination emerged as a more influential factor than surface material, significantly affecting parameters such as slippage and cost of transport (CoT). Higher commanded speeds were also found to enhance locomotion performance under all evaluated scenarios. This work represents a first step toward establishing reproducible and systematic benchmarking practices for legged robotics, offering a practical and scalable approach to performance evaluation in controlled yet realistic environments.},
  archive      = {J_MRA},
  author       = {David Rodriguez-Cianca and Paulino Sendin and Giuseppe Alfonso and Davide De Benedittis and Simone Tolomei and Franco Angelini and Manolo Garabini and Diego Torricelli},
  doi          = {10.1109/MRA.2025.3631570},
  journal      = {IEEE Robotics & Automation Magazine},
  month        = {12},
  pages        = {2--12},
  shortjournal = {IEEE Robot. Autom. Mag.},
  title        = {A reproducible benchmarking methodology to assess robotic locomotion over irregular terrains: A practical and scalable approach},
  year         = {2025},
}
</textarea>
</details></li>
</ul>
