</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {The Mobile Object Manipulation Operator (MOMO) is an innovative and reconfigurable robotic system that transforms traditional serving robots into mobile manipulators. Leveraging the form factor and mobility of serving robots, MOMO integrates up to three pluggable devices, including six-DoF manipulators of varying sizes or a three-DoF sensor head. Its design incorporates two independent shoulder lifts to enhance vertical reach. The adaptability of the system tailors its capabilities to tasks beyond simple object transportation. As opposed to current food delivery robots, MOMO showcases its ability to remove obstructions from the floor and deliver items to recipients without human intervention.},
  archive      = {J_MRA},
  author       = {Sankalp Yamsani and Kevin Gim and Tyler Smithline and Richard Qiu and Roman Mineyev and Kenta Hirashima and Sungmin Kang and Kyungseo Park and Yoon-Koo Kang and Seulbi An and Sunghwan Ahn and Joohyung Kim},
  doi          = {10.1109/MRA.2025.3616802},
  journal      = {IEEE Robotics & Automation Magazine},
  month        = {11},
  pages        = {2--12},
  shortjournal = {IEEE Robot. Autom. Mag.},
  title        = {Serving innovation: Seamless service by advancing food runners with mobile manipulation},
  year         = {2025},
}
</textarea>
</details></li>
<li><details>
<summary>
(2025). Managing safety and ethical norm violations in robotic industrial cells: An ontological system based on the IEEE 7007-2021 standard. <em>MRA</em>, 2--10. (<a href='https://doi.org/10.1109/MRA.2025.3620101'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {The IEEE 7007-2021 standard [1] provides a set of ontologies for the development of ethically driven robotics and automation systems, including a structured framework called ethical violation management (EVM) for evaluating responsibility in the event of norm violations. However, the standard remains largely conceptual, lacking concrete implementations in safety-critical environments, such as industrial robotic cells. This article proposes a novel ontology-driven system, called robotic cell safety monitoring (RCSM), applied in the context of a robotic industrial cell in Brazil. It extends and operationalizes the IEEE 7007 framework to enable real-time detection, analysis, and reasoning over safety norm violations in industrial human–robot interaction (HRI) scenarios. Our proposal integrates national safety regulations with semantic models to monitor the behavior of agents and assess ethical responsibility in the event of norm violations. A series of experiments, including tests in simulated and real-world robotic cell scenarios, are performed to validate the system’s ability to identify violations, assign responsibilities, and support compliance with safety protocols, which helps to bridge the gap between ethical standards and practical robotic deployments in industrial automation.},
  archive      = {J_MRA},
  author       = {Taiser Barros and Caroline Santos dos Reis and Hugo Constantinopolos and Renan Maffei and Edson Prestes},
  doi          = {10.1109/MRA.2025.3620101},
  journal      = {IEEE Robotics & Automation Magazine},
  month        = {11},
  pages        = {2--10},
  shortjournal = {IEEE Robot. Autom. Mag.},
  title        = {Managing safety and ethical norm violations in robotic industrial cells: An ontological system based on the IEEE 7007-2021 standard},
  year         = {2025},
}
</textarea>
</details></li>
