<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {No-reference bitstream-layer point cloud quality assessment (PCQA) can be deployed without full decoding at any network node to achieve real-time quality monitoring. In this work, we develop the first PCQA model dedicated to Trisoup-Lifting encoded 3D point clouds by analyzing bitstreams without full decoding. Specifically, we investigate the relationship among texture bitrate per point (TBPP), texture complexity (TC) and texture quantization parameter (TQP) while geometry encoding is lossless. Subsequently, we estimate TC by utilizing TQP and TBPP. Then, we establish a texture distortion evaluation model based on TC, TBPP and TQP. Ultimately, by integrating this texture distortion model with a geometry attenuation factor, a function of trisoupNodeSizeLog2 (tNSL), we acquire a comprehensive NR bitstream-layer PCQA model named streamPCQ-TL. In addition, this work establishes a database named WPC6.0, the first PCQA database dedicated to Trisoup-Lifting encoding mode, encompassing 400 distorted point clouds with 4 geometry multiplied by 5 texture distortion levels. Experiment results on M-PCCD, ICIP2020 and the proposed WPC6.0 database suggest that the proposed streamPCQ-TL model exhibits robust and notable performance in contrast to existing advanced PCQA metrics, particularly in terms of computational cost. The dataset and source code will be publicly released at https://github.com/qdushl/Waterloo-Point-Cloud-Database-6.0.},
  archive      = {J_TVCG},
  author       = {Juncheng Long and Honglei Su and Qi Liu and Hui Yuan and Wei Gao and Jiarun Song and Zhou Wang},
  doi          = {10.1109/TVCG.2025.3629111},
  journal      = {IEEE Transactions on Visualization and Computer Graphics},
  month        = {11},
  pages        = {1--15},
  shortjournal = {IEEE Trans. Vis. Comput. Graph.},
  title        = {Perceptual quality assessment of trisoup-lifting encoded 3D point clouds},
  year         = {2025},
}
</textarea>
</details></li>
<li><details>
<summary>
(2025). Untangling rhetoric, pathos, and aesthetics in data visualization. <em>TVCG</em>, 1--20. (<a href='https://doi.org/10.1109/TVCG.2025.3628181'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Contemporary discourse on data communication has discussed logos (reason) and, more recently, ethos (credibility) extensively. While the concept of pathos (emotional appeal) has received growing attention in the visualization community in recent years, its connection to related concepts such as rhetoric and aesthetics remains underexplored. In this paper, we provide working definitions of these terms, contextualize them within data visualization, and explore their overlaps and differences in light of their historical development. This historical perspective offers a more holistic understanding of how these approaches in science and philosophy have evolved over time, contributing to a deeper comprehension of their integration into the design process. Drawing on Campbell's seven circumstances, we illustrate how pathos functions as a rhetorical strategy in contemporary data visualizations, examining the interplay of rhetorical strategies, aesthetic qualities, and offering our interpretation of how these elements work together.},
  archive      = {J_TVCG},
  author       = {Verena Prantl and Torsten Möller and Laura Koesten},
  doi          = {10.1109/TVCG.2025.3628181},
  journal      = {IEEE Transactions on Visualization and Computer Graphics},
  month        = {11},
  pages        = {1--20},
  shortjournal = {IEEE Trans. Vis. Comput. Graph.},
  title        = {Untangling rhetoric, pathos, and aesthetics in data visualization},
  year         = {2025},
}
</textarea>
</details></li>
