(2025). Exploiting output activation sparsity using bit-separable multiplier in CNN accelerator. <em>MICRO</em>, 1--9. (<a href='https://doi.org/10.1109/MM.2025.3608442'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {This paper demonstrates a bit-separable multiplier (BSM) in CNN accelerators to leverage output activation sparsity. BSM improves computational efficiency by predicting the output of activation functions with sparsity, such as ReLU, using only the upper bits of the weight and skipping unnecessary lower-bit computations. In particular, using BSM resulted in a 25% improvement in inference speed with only a 0.07% accuracy drop across various CNN models. Proposed CNN accelerator was fabricated using a commercial 130nm process and achieved 3 TOPS/W. For MobileNet, the proposed architecture improved processing speed by 26% and power consumption by 28%. BSM presents a novel approach to exploiting output activation sparsity.},
  archive      = {J_MICRO},
  author       = {Seunghyun Park and Daejin Park},
  doi          = {10.1109/MM.2025.3608442},
  journal      = {IEEE Micro},
  month        = {10},
  pages        = {1--9},
  shortjournal = {IEEE Micro},
  title        = {Exploiting output activation sparsity using bit-separable multiplier in CNN accelerator},
  year         = {2025},
}
</textarea>
</details></li>
<li><details>
<summary>
(2025). Enabling deep visibility into VxWorks-based embedded controllers in cyber-physical systems for anomaly detection. <em>MICRO</em>, 1--12. (<a href='https://doi.org/10.1109/MM.2025.3617807'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {We propose the DIVER (Defensive Implant for Visibility into Embedded Run-times) framework for real-time deep visibility into embedded control devices in cyber-physical systems (CPSs). DIVER enables run-time detection of anomalies and targets devices running VxWorks real-time operating system (RTOS), precluding traditional methods of implementing dynamic monitors using OS (e.g., Linux, Windows) functions. DIVER has two components: 201Cmeasurer” implant embedded into VxWorks kernel to collect run-time measurements and provide interactive/streaming interfaces over TCP/IP; remote “listener” that acquires and analyzes measurements and provides interactive user interface. DIVER focuses on small embedded devices with stringent resource constraints (e.g., insufficient storage to locally store measurements). To show efficacy and scalability of DIVER, we demonstrate on two embedded devices with different processor architectures and VxWorks versions: Motorola ACE Remote Terminal Unit used in CPS including power systems and Raspberry Pi representative of Internet-of-Things (IoT) applications.},
  archive      = {J_MICRO},
  author       = {Prashanth Krishnamurthy and Ramesh Karri and Farshad Khorrami},
  doi          = {10.1109/MM.2025.3617807},
  journal      = {IEEE Micro},
  month        = {10},
  pages        = {1--12},
  shortjournal = {IEEE Micro},
  title        = {Enabling deep visibility into VxWorks-based embedded controllers in cyber-physical systems for anomaly detection},
  year         = {2025},
}
</textarea>
