(2025). CHEST: An application to support teachers in the use of linked open data for ubiquitous learning. <em>TLT</em>, 1--15. (<a href='https://doi.org/10.1109/TLT.2025.3629584'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Ubiquitous learning (u-learning) leverages educational technologies to help students learn anywhere and anytime across multiple physical and virtual spaces. However, u-learning applications face a challenging trade-off: should they provide a predefined set of u-learning resources, thus saving time to teachers, but limiting their applicability to a wider range of u-learning situations? Or should they allow teachers to create their own u-learning resources, improving flexibility, but requiring a non-negligible effort from teachers that typically ends up in learning resources that cannot be reused by other teachers or by other u-learning applications? CHEST, the application presented in this paper, addresses this trade-off proposing the use (and reuse) of Linked Open Data (LOD) to support teachers in the design of u-learning situations in the Cultural Heritage domain. CHEST hides the complexity of LOD to teachers, thus reducing the effort in creating u-learning situations, while, at the same time, taking advantage of its reusable nature. CHEST allows teachers to create and reuse three types of learning resources in the form of LOD: spatial things, learning tasks, and itineraries (which group the other two types of resources). The paper elicits the requirements considered for the development of CHEST, describes its architecture, and presents the results of an evaluation study carried out with a CHEST prototype in the context of a University course involving two teachers and 14 students. The evaluation examines how CHEST supports teachers in the creation and reuse of u-learning resources based on LOD, paying attention to the balance between flexibility and required effort, while it also showcases how CHEST supports the enactment of u-learning situations in an authentic educational context. The study provides valuable insights into the applicability and effectiveness of CHEST within a specific educational context.},
  archive      = {J_TLT},
  author       = {Pablo García-Zarza and Guillermo Vega-Gorgojo and Miguel L. Bote-Lorenzo and Vanesa Gallego-Lema and Juan I. Asensio-Pérez and Eduardo Gómez-Sánchez},
  doi          = {10.1109/TLT.2025.3629584},
  journal      = {IEEE Transactions on Learning Technologies},
  month        = {11},
  pages        = {1--15},
  shortjournal = {IEEE Trans. Learn. Technol.},
  title        = {CHEST: An application to support teachers in the use of linked open data for ubiquitous learning},
  year         = {2025},
}
</textarea>
</details></li>
<li><details>
<summary>
(2025). Graph neural network empowers intelligent education: A systematic review from an application perspective. <em>TLT</em>, 1--18. (<a href='https://doi.org/10.1109/TLT.2025.3630276'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Intelligent education, also known as education driven by Artificial Intelligence (AI), has emerged as a research hotspot. AI technologies can empower various intelligent education applications, such as learning behaviors analysis and adaptive learning. In recent years, Graph Neural Network (GNN), as an advanced AI technology, has demonstrated its superiority in extracting insights from graph-structured data. It also has attracted significant attention in the field of intelligent education, where graph-structured data is ubiquitous (e.g., student/teacher collaboration networks). Although previous review studies have explored the applications of GNN in some fields, there has been limited discussion on their specific applications and potential in intelligent education. To fill this gap, we collected 85 representative studies on GNN applications in intelligent education, and conducted a systematical review through the bibliometric analysis. This review uncovers three key findings: (1) Benefiting from the vigorous promotion by Chinese scholars, GNN applications in intelligent education have demonstrated a remarkable growth over the past six years. (2) Various GNNs have been extensively utilized across six pivotal application scenarios: learner modeling, learning performance prediction, learning resource recommendation, intelligent teaching assistance, classroom behavior analysis, and educational emotion analysis, all of which have exhibited high performance. (3) Despite notable challenges, research on GNN empowering intelligent education still has many promising directions, such as enhancing interpretability, integrating multimodal educational data, collaborating with large language model, and expanding more applications.},
  archive      = {J_TLT},
  author       = {Chaobo He and Jian Luo and Yong Tang and Guanliang Chen and Quanlong Guan},
  doi          = {10.1109/TLT.2025.3630276},
  journal      = {IEEE Transactions on Learning Technologies},
  month        = {11},
  pages        = {1--18},
  shortjournal = {IEEE Trans. Learn. Technol.},
  title        = {Graph neural network empowers intelligent education: A systematic review from an application perspective},
  year         = {2025},
}
</textarea>
</details></li>
</ul>
