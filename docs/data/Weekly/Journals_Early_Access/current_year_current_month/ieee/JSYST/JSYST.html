<li><details>
<summary>
(2025). Modeling and small-signal stability analysis of distributed economic dispatch system for new distribution network. <em>JSYST</em>, 1--12. (<a href='https://doi.org/10.1109/JSYST.2025.3628024'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {With faster computation and less communication, distributed control strategies are more suitable for the new distribution system with initiative and flexibility. However, due to the deep cyber-physical coupling in the new distribution network (DN), it is urgent to study whether the economic dispatch strategy that only considers the information level without taking into account the physical layer of power can meet the requirements for stable operation of the system. Therefore, we design a modeling method of distributed economic dispatch system (DEDS) based on consensus protocol from the perspective of cyber-physical coupling. Firstly, the architecture and control strategy of the DEDS are introduced. Then, the distributed generation control models are established, which are combined with the DN model and linearized to derive the state-space model of the DEDS. Subsequently, the small-signal stability analysis of the DEDS is performed by means of the eigenvalue analysis method. Finally, the validity of the DEDS and the correctness of the stability analysis are demonstrated by a simulation model in IEEE-33 bus DN.},
  archive      = {J_JSYST},
  author       = {Jian Le and Guangyi Luo and Hongke Lang and Jing Wang and Weihao Wang},
  doi          = {10.1109/JSYST.2025.3628024},
  journal      = {IEEE Systems Journal},
  month        = {12},
  pages        = {1--12},
  shortjournal = {IEEE Syst. J.},
  title        = {Modeling and small-signal stability analysis of distributed economic dispatch system for new distribution network},
  year         = {2025},
}
</textarea>
</details></li>
<li><details>
<summary>
(2025). Direct uplink connectivity in space MIMO systems with THz and FSO intersatellite links. <em>JSYST</em>, 1--12. (<a href='https://doi.org/10.1109/JSYST.2025.3633170'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {This article investigates uplink transmission from a single-antenna mobile phone to a cluster of satellites, emphasizing the role of intersatellite links (ISLs) in cooperative signal detection. We study nonideal ISLs, focusing on terahertz (THz) and free-space optical (FSO) links with respect to ergodic capacity. A scenario based on the recent 3GPP standard specifies the frequency band, bandwidth, antenna gains, power levels, and channel characteristics for nonterrestrial networks. We also propose a satellite selection method to identify the optimal master node for signal processing, considering both the user–satellite link and ISL channels. For THz ISLs, we derive a closed-form capacity approximation under instantaneous or statistical channel state information, while for FSO ISLs, we present a closed-form approximate upper bound incorporating pointing error loss. We further assess the impact of ISL frequency and pointing errors on spectral efficiency. Simulations show that multisatellite multiple-input multiple-output communications significantly outperforms single-satellite systems, and that the proposed upper bound closely matches Monte Carlo results.},
  archive      = {J_JSYST},
  author       = {Zohre Mashayekh Bakhsh and Yasaman Omid and Gaojie Chen and Yi Ma and Farbod Kayhan and Rahim Tafazolli},
  doi          = {10.1109/JSYST.2025.3633170},
  journal      = {IEEE Systems Journal},
  month        = {12},
  pages        = {1--12},
  shortjournal = {IEEE Syst. J.},
  title        = {Direct uplink connectivity in space MIMO systems with THz and FSO intersatellite links},
  year         = {2025},
}
</textarea>
</details></li>
