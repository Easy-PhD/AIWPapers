<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {The vision-language pre-training has enabled deep models to make a huge step forward in generalizing across unseen domains. The recent learning method based on the vision-language pre-training model is a great tool for domain generalization and can solve this problem to a large extent. However, there are still some issues that an advancement still suffers from trading-off between domain invariance and class separability, which are crucial in current domain generalization (DG) problems. In this paper, we introduce a novel multi-modal prompt learning strategy called Transitive vision-language Prompt Learning (TPL) that leverages deep vision prompts to address domain invariance while utilizing language prompts to ensure class separability, coupled with adaptive weighting mechanisms to balance domain invariance and class separability. Unlike existing CLIP-based methods that either use fixed prompts or adapt only single modalities, TPL jointly optimizes both vision and language prompts through a carefully designed transitive learning mechanism in a multi-modal framework. This approach directly addresses the fundamental problem of domain generalization by ensuring that the model effectively captures necessary domain-invariant features, greatly enhancing its ability to adapt and perform robustly in unfamiliar or new domains. Extensive experiments demonstrate that deep vision prompts effectively extract domain-invariant features, significantly improving the generalization ability of deep models and achieving state-of-the-art performance on three datasets.},
  archive      = {J_TETCI},
  author       = {Liyuan Wang and Yan Jin and Zhen Chen and Jinlin Wu and Mengke Li and Yang Lu and Hanzi Wang},

  pages        = {1--15},
  shortjournal = {IEEE Trans. Emerg. Topics Comput. Intell.},
  title        = {Transitive vision-language prompt learning for domain generalization},

}
