  abstract     = {Human color vision depends on the interaction of L‒, M‒, and S‒cone photoreceptors, and impairments in this system lead to color vision deficiencies (CVDs). Traditional psychophysical tests are subjective and qualitative. This study aimed to develop an objective and quantitative evaluation method for human color vision based on Electroencephalography (EEG). Steady-state visual evoked potentials (SSVEPs) were induced by a series of luminance-color coupled stimuli (i.e., red-green pattern-reversal checkerboards with various red-green luminance ratios) for ten dyschromatopsia and seven healthy controls. Then, based on the theory of equiluminance point, this study established a luminance ratio-SSVEP response curve model and proposed the corresponding equiluminance point threshold determination criteria. After obtaining the equiluminance value, a color vision index (CVI) was designed to characterize the functional state of color vision objectively. Meanwhile, the psychophysical detection means of Farnsworth–Munsell (FM) 100-hue testing was carried out to obtain subjective results. The results of the equiluminance value show a difference among normal, deutan, and protan (P < 0.001, respectively), revealing that equiluminance points can qualitatively distinguish normal and abnormal color vision as well as determine the abnormal type. The CVIs show strong correlations with psychophysical test results of both total error scores (TES) and confusion index (C-index) from the FM 100-hue testing, with Pearson’s r values of up to 0.938, revealing that this proposed CVI can be regarded as a quantitative indicator for assessing color vision. The findings of this study indicated that SSVEP might be a potential biomarker to measure human color vision function objectively and quantitatively.},
