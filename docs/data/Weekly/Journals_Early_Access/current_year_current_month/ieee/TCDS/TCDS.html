(2025). Trust-aware human-robot collaborative decision-making with LLM-generated data. <em>TCDS</em>, 1--16. (<a href='https://doi.org/10.1109/TCDS.2025.3628551'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Achieving superior human-robot collaboration requires the robot to consider the dynamic trust of the human partner in decision-making. Existing research often oversimplifies tasks due to limited real human-robot collaboration data. Therefore, overcoming the scarcity of real human-robot collaboration data is essential. To address this, We utilize a Large Language Model (LLM) to simulate various types of decision-makers and collaborate with robots in sequential tasks to acquire simulated datasets, including trust and action data. We also propose a two-stage training framework to improve the robot’s decision-making ability. In the first stage, we pre-train the trust prediction model and the decision-making model based on the simulation dataset. In the second stage, these models are fine-tuned with a small amount of real data. Our framework effectively leverages prior knowledge from simulated data while bridging the gap between LLM-generated and real human distributions. To validate our method and framework, we build a 3D virtual environment and design human-robot collaboration sequential tasks. We conduct experimental validation involving 39 participants. In the experiment, our trust prediction model achieves an RMSE of 0.0603 in trust prediction tests. Our trust-aware decision-making model demonstrates a 120.9% increase in reward compared to the perception-based method.},
  archive      = {J_TCDS},
  author       = {Boyuan Du and Peiyan Li and Shuyuan Zhang and Huaping Liu and Yuanlong Yu},
  doi          = {10.1109/TCDS.2025.3628551},
  journal      = {IEEE Transactions on Cognitive and Developmental Systems},
  month        = {11},
  pages        = {1--16},
  shortjournal = {IEEE Trans. Cogn. Develop. Syst.},
  title        = {Trust-aware human-robot collaborative decision-making with LLM-generated data},
  year         = {2025},
}
</textarea>
</details></li>
<li><details>
<summary>
(2025). Learning-based optimal formation scheme for disturbed multi-agent systems via generalized policy iteration. <em>TCDS</em>, 1--13. (<a href='https://doi.org/10.1109/TCDS.2025.3628864'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {In order to solve the formation problem of nonlinear continuous-time multi-agent system under disturbance injection and input saturation, a robust formation scheme is designed based on generalized policy iteration and adaptive critic learning. First, the robust formation problem is depicted as a mixed game. In this case, a cooperative game is established among the agents, and the local neighborhood formation error stabilization problem of each agent under disturbance is described as zero-sum differential game problem, the key to which is to solve the Hamilton-Jacobi-Isaacs equation. Then, to obtain the approximate solution of Hamilton-Jacobi-Isaacs equation, a continuous-time generalized policy iteration algorithm is designed. In order to implement the iterative algorithm, the single-critic neural network structure is employed to obtain the optimal formation policy under the worst-case disturbance. It is proved that the local neighborhood formation error and the weight estimation error of the critic network are uniformly ultimately bounded. Finally, the proposed learning-based robust formation scheme is applied to a nonlinear multi-agent system and a spacecraft formation system. Simulation results demonstrate that the proposed robust formation scheme has good cognition and suppression ability to disturbance injection, so as to complete the formation task.},
  archive      = {J_TCDS},
  author       = {Chaoxu Mu and Junnan Zhang and Ke Wang and Haixing Li and Changyin Sun},
  doi          = {10.1109/TCDS.2025.3628864},
  journal      = {IEEE Transactions on Cognitive and Developmental Systems},
  month        = {11},
  pages        = {1--13},
  shortjournal = {IEEE Trans. Cogn. Develop. Syst.},
  title        = {Learning-based optimal formation scheme for disturbed multi-agent systems via generalized policy iteration},
  year         = {2025},
}
</textarea>
