<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Unmanned Aerial Vehicle (UAV) object detection is essential for autonomous UAV operations. However, current UAV object detection algorithms ignore leveraging scene features to assist in object detection, which hinders the improvement of the algorithm’s generalization across multiple scenarios. To address this, we propose the UAV Scene-driven Object Detection Network (UAV-SODN). Firstly, we design the Global Characteristics Modeling (GCM) module to extract scene features and the Region-aware Attention (ReA) module to capture the global integrity features of the scene. The scene classification task is leveraged to assist in optimizing the module’s parameters. Subsequently, we design the Scene Feature Guidance (SFG) module to guide the image feature extraction and object detection process using scene features, encouraging the network to effectively mine scene-related clues and query the targets of the current scene. Finally, we construct a multi-scene UAV object detection dataset, and experiments show that our algorithm effectively improves performance in multi-scenario UAV object detection tasks.},
  archive      = {J_MIS},

  pages        = {1--12},

  title        = {Exploring the potential of scene features for UAV object detection},
