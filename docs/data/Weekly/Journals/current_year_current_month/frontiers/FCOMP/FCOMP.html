(2025). MESIAS: A web-based platform rooted in ethical principles for evaluating trustworthiness in AI projects. <em>FCOMP</em>, <em>7</em>, 1694979. (<a href='https://doi.org/10.3389/fcomp.2025.1694979'>www</a>)

<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {The accelerated growth of artificial intelligence (AI)-based projects has intensified the need for tools to assess their reliability, safety, and ethical alignment. In response to this challenge, the MESIAS initiative was developed. MESIAS is a web-based platform that provides a framework for evaluating AI systems through the lenses of ethical principles and international governance frameworks. The tool features a virtual assistant, adaptive forms, and a monitoring dashboard. The validation process comprised three steps: a preliminary investigation into operational efficiency, expert judgment validation with technological leaders, and a user satisfaction validation with 52 technology professionals. The operational assessment revealed a substantial 41.8% reduction in total assessment time and a 40% reduction in human resources required. Expert validation reflected a general acceptance of 85%. User validation revealed elevated satisfaction levels: 92% for usability, 94% for content, 91% for follow-up, and 95% for overall satisfaction. The study results indicate that the MESIAS strategy is a practical and effective approach to enhancing ethical governance in AI, particularly in public settings, fostering more responsible and informed decision-making processes.},
  archive      = {J_FCOMP},
  author       = {Romani, Georgina and Avendaño, Cesar and Santisteban, José},
  doi          = {10.3389/fcomp.2025.1694979},
  journal      = {Frontiers in Computer Science},
  month        = {12},
  pages        = {1694979},
  shortjournal = {Front. Comput. Sci.},
  title        = {MESIAS: A web-based platform rooted in ethical principles for evaluating trustworthiness in AI projects},
  volume       = {7},
  year         = {2025},
}
</textarea>
</details></li>
<li><details>
<summary>
(2025). AIICN: A 7G multi-path transmission based on information-centric network. <em>FCOMP</em>, <em>7</em>, 1659616. (<a href='https://doi.org/10.3389/fcomp.2025.1659616'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {The 7G network refers to the seventh generation of mobile communication standards, which will integrate satellites, airships, and base stations to achieve data transmission with longer coverage. It can also be deeply integrated with artificial intelligence, big data, and other technologies. Multi-path transmission achieves bandwidth aggregation by establishing multiple paths between the sender and the receiver, improving transmission reliability and data accessibility. Therefore, it is of great significance to apply multi-path transmission to 7G networks. However, traditional multi-path transmission technologies (MPTCP/MPQUIC) cannot cope with the new features emerging in 7G networks, such as path selection, low latency, and protocol incompatibility, which require lower complexity. The Information-Centric Network (ICN) offers the advantages of strong mobility and bandwidth efficiency and has been widely adopted in integrated networks. Therefore, this study proposes an artificial intelligence multi-path transmission mechanism based on the ICN and mathematically models the entire transmission process as a mixed-integer linear programming model to solve the problem of multi-path transmission path conflicts in 7G networks (called AIICN). Experiments demonstrate that the proposed AIICN multi-path transmission offers advantages of high throughput, low complexity, and fast algorithm convergence, with a transmission throughput approximately 21% higher than that of traditional multi-path transmission. AIICN can be well applied to 7G networks to achieve efficient multi-path transmission.},
  archive      = {J_FCOMP},
  author       = {Xing, Ziyang},
  doi          = {10.3389/fcomp.2025.1659616},
  journal      = {Frontiers in Computer Science},
  month        = {12},
  pages        = {1659616},
  shortjournal = {Front. Comput. Sci.},
  title        = {AIICN: A 7G multi-path transmission based on information-centric network},
  volume       = {7},
  year         = {2025},
}
</textarea>
</details></li>
