</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Hyperparameters are configuration variables controlling the behavior of machine learning algorithms. They are ubiquitous in machine learning and artificial intelligence and the choice of their values determines the effectiveness of systems based on these technologies. Manual hyperparameter search is often time-consuming and becomes infeasible when the number of hyperparameters is large. Automating the search is an important step towards advancing, streamlining, and systematizing machine learning, freeing researchers and practitioners alike from the burden of finding a good set of hyperparameters by trial and error. In this survey, we present a unified treatment of hyperparameter optimization, providing the reader with examples, insights into the state-of-the-art, and numerous links to further reading. We cover the main families of techniques to automate hyperparameter search, often referred to as hyperparameter optimization or tuning, including random and quasi-random search, bandit-, model-, population-, and gradient-based approaches. We further discuss extensions, including online, constrained, and multi-objective formulations, touch upon connections with other fields, such as meta-learning and neural architecture search, and conclude with open questions and future research directions.},
  archive      = {J_FTML},
  author       = {Luca Franceschi and Michele Donini and Valerio Perrone and Aaron Klein and Cédric Archambeau and Matthias Seeger and Massimiliano Pontil and Paolo Frasconi},
  doi          = {10.1561/2200000088},
  journal      = {Foundations and Trends® in Machine Learning},
  month        = {10},
  number       = {6},
  pages        = {1054--1201},
  shortjournal = {Found. Trends Mach. Learn.},
  title        = {Hyperparameter optimization in machine learning},
  volume       = {18},
  year         = {2025},
}
</textarea>
</details></li>
</ul>

<h2 id="ftopt">FTOPT - 1</h2>

(2025). Simulation optimization and artificial intelligence. <em>FTOPT</em>, <em>9</em>(4), 407--566. (<a href='https://doi.org/10.1561/2400000046'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {With the relentless increase in computing power and the ubiquitous availability of data in many industries, the fields of simulation optimization and artificial intelligence have emerged at the scientific and engineering forefront in their societal impact, manifested in the pervasiveness of technologies such as large language models, chatbots, digital twins, and agent-based systems. We examine cross-fertilization between simulation optimization and artificial intelligence, with a particular focus on reinforcement learning, highlighting research that has been mutually beneficial. After reviewing relevant methodologies from stochastic simulation and optimization, we provide an overview of foundational approaches of machine learning, and then present examples of the synergies between the fields, followed by real-world applications and case studies, including some futurist and forward-looking concepts.},
  archive      = {J_FTOPT},
  author       = {Yijie Peng and Chun-Hung Chen and Michael C. Fu},
  doi          = {10.1561/2400000046},
  journal      = {Foundations and Trends® in Optimization},
  month        = {12},
  number       = {4},
  pages        = {407--566},
  shortjournal = {Found. Trends Optim.},
  title        = {Simulation optimization and artificial intelligence},
  volume       = {9},
  year         = {2025},
}
</textarea>
</details></li>
</ul>

<h2 id="ftsp">FTSP - 1</h2>

<li><details>
<summary>
(2025). Graph learning. <em>FTSP</em>, <em>19</em>(4), 371--551. (<a href='https://doi.org/10.1561/2000000137'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Graph learning has rapidly evolved into a critical subfield of machine learning and artificial intelligence (AI), enabling the modeling of complex relational data that arises in domains such as social networks, biology, finance, transportation, and knowledge representation. Its development began with early graph-theoretic methods, gaining significant momentum with the advent of graph neural networks (GNNs). Over the past decade, progress in scalable architectures, dynamic graph modeling, multimodal learning, generative AI, explainable AI (XAI), and responsible AI has broadened the applicability of graph learning to various challenging environments. Graph learning is significant due to its ability to model complex, non-Euclidean relationships that traditional machine learning struggles to capture, thus better supporting real-world applications ranging from drug discovery and fraud detection to recommender systems and scientific reasoning. However, challenges like scalability, generalization, heterogeneity, interpretability, and trustworthiness must be addressed to unlock its full potential. This survey provides a comprehensive introduction to graph learning, focusing on key dimensions including scalable, temporal, multimodal, generative, explainable, and responsible graph learning. We review state-of-the-art techniques for efficiently handling large-scale graphs, capturing dynamic temporal dependencies, integrating heterogeneous data modalities, generating novel graph samples, and enhancing interpretability to foster trust and transparency. We also explore ethical considerations, such as privacy and fairness, to ensure responsible deployment of graph learning models. Additionally, we identify and discuss emerging topics, highlighting recent integration of graph learning and other AI paradigms and offering insights into future directions. This survey serves as a valuable resource for researchers and practitioners seeking to navigate the rapidly evolving landscape of graph learning.},
  archive      = {J_FTSP},
  author       = {Feng Xia and Ciyuan Peng and Jing Ren and Falih Gozi Febrinanto and Renqiang Luo and Vidya Saikrishna and Shuo Yuo and Xiangjie Kong},
  doi          = {10.1561/2000000137},
  journal      = {Foundations and Trends® in Signal Processing},
  month        = {11},
  number       = {4},
  pages        = {371--551},
  shortjournal = {Found. Trends Signal Process.},
  title        = {Graph learning},
  volume       = {19},
  year         = {2025},
}
</textarea>
</details></li>
</ul>
