<li><details>
<summary>
(2025). Elements of world knowledge (EWoK): A cognition-inspired framework for evaluating basic world knowledge in language models. <em>TACL</em>, <em>13</em>, 1245-1270. (<a href='https://doi.org/10.1162/TACL.a.38'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {The ability to build and reason about models of the world is essential for situated language understanding. But evaluating world modeling capabilities in modern AI systems—especially those based on language models—has proven challenging, in large part because of the difficulty of disentangling conceptual knowledge about the world from knowledge of surface co-occurrence statistics. This paper presents Elements of World Knowledge ( EWoK ), a framework for evaluating language models’ understanding of the conceptual knowledge underlying world modeling. EWoK targets specific concepts from multiple knowledge domains known to be important for world modeling in humans, from social interactions ( help, deceive ) to spatial relations ( left, right ). Objects, agents, and locations in the items can be flexibly filled in, enabling easy generation of multiple controlled datasets. We then introduce EWoK-core-1.0 , a dataset of 4,374 items covering 11 world knowledge domains. We evaluate 20 open-weights large language models (1.3B–70B parameters) and compare them with human performance. All tested models perform worse than humans, with results varying drastically across domains. Performance on social interactions and social properties was highest and performance on physical relations and spatial relations was lowest. Overall, this dataset highlights simple cases where even large models struggle and presents rich avenues for targeted research on LLM world modeling capabilities.},
  archive      = {J_TACL},
  author       = {Ivanova, Anna A. and Sathe, Aalok and Lipkin, Benjamin and Kumar, Unnathi U. and Radkani, Setayesh and Clark, Thomas H. and Kauf, Carina and Hu, Jennifer and Pramod, R. T. and Grand, Gabriel and Paulun, Vivian C. and Ryskina, Maria and Akyürek, Ekin and Wilcox, Ethan G. and Rashid, Nafisa and Choshen, Leshem and Levy, Roger and Fedorenko, Evelina and Tenenbaum, Joshua and Andreas, Jacob},
  doi          = {10.1162/TACL.a.38},
  journal      = {Transactions of the Association for Computational Linguistics},
  month        = {10},
  pages        = {1245-1270},
  shortjournal = {Trans. Assoc. Comput. Lingu.},
  title        = {Elements of world knowledge (EWoK): A cognition-inspired framework for evaluating basic world knowledge in language models},
  volume       = {13},
  year         = {2025},
}
</textarea>
</details></li>
<li><details>
<summary>
(2025). A systematic review of NLP for dementia: Tasks, datasets, and opportunities. <em>TACL</em>, <em>13</em>, 1204-1244. (<a href='https://doi.org/10.1162/TACL.a.35'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {The close link between cognitive decline and language has fostered long-standing collaboration between the NLP and medical communities in dementia research. To examine this, we reviewed over 240 papers applying NLP to dementia-related efforts, drawing from medical, technological, and NLP-focused literature. We identify key research areas, including dementia detection, linguistic biomarker extraction, caregiver support, and patient assistance, showing that half of all papers focus solely on dementia detection using clinical data. Yet, many directions remain unexplored, such as artificially degraded language models, synthetic data, digital twins, and more. We highlight gaps and opportunities around trust, scientific rigor, applicability, and cross-community collaboration. We raise ethical dilemmas in the field, and highlight the diverse datasets encountered throughout our review including recorded, written, structured, spontaneous, synthetic, clinical, social media–based, and more. This review aims to inspire more creative, impactful, and rigorous research on NLP for dementia.},
  archive      = {J_TACL},
  author       = {Peled-Cohen, Lotem and Reichart, Roi},
  doi          = {10.1162/TACL.a.35},
  journal      = {Transactions of the Association for Computational Linguistics},
  month        = {10},
  pages        = {1204-1244},
  shortjournal = {Trans. Assoc. Comput. Lingu.},
  title        = {A systematic review of NLP for dementia: Tasks, datasets, and opportunities},
  volume       = {13},
  year         = {2025},
}
</textarea>
</details></li>
</ul>
