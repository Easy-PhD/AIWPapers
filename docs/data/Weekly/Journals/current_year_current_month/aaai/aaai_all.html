  <script>
    function copy(element) {
      if (element.type == "button"){
      element.type="text";
      }
      element.style.color="black";
      element.style.backgroundColor="#C7EDCC";
      element.select();
      element.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(element.value);
      window.getSelection().removeAllRanges();
      element.type="button";
    }
  </script>

<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Identifying and handling label errors can significantly enhance the accuracy of supervised machine learning models. Recent approaches for identifying label errors demonstrate that a low self-confidence of models with respect to a certain label represents a good indicator of an erroneous label. However, latest work has built on softmax probabilities to measure selfconfidence. In this paper, we argue that—as softmax probabilities do not reflect a model’s predictive uncertainty accurately— label error detection requires more sophisticated measures of model uncertainty. Therefore, we develop a range of novel, model-agnostic algorithms for Uncertainty Quantification-Based Label Error Detection (UQ-LED), which combine the techniques of confident learning (CL), Monte Carlo Dropout (MCD), model uncertainty measures (e.g., entropy), and ensemble learning to enhance label error detection. We comprehensively evaluate our algorithms on four image classification benchmark datasets in two stages. In the first stage, we demonstrate that our UQ-LED algorithms outperform state-of-the-art confident learning in identifying label errors. In the second stage, we show that removing all identified errors from the training data based on our approach results in higher accuracies than training on all available labeled data. Importantly, besides our contributions to the detection of label errors, we particularly propose a novel approach to generate realistic, class-dependent label errors synthetically. Overall, our study demonstrates that selectively cleaning datasets with UQ-LED algorithms leads to more accurate classifications than using larger, noisier datasets.},
  archive      = {J_JAIR},
  author       = {Johannes Jakubik and Michael Vössing and Manil Maskey and Christopher Wölfle and Gerhard Satzger},
  doi          = {10.1613/jair.1.16158},
  journal      = {Journal of Artificial Intelligence Research},
  month        = {11},
  shortjournal = {J. Artif. Intell. Res.},
  title        = {Improving label error detection and elimination with uncertainty quantification},
  volume       = {84},
  year         = {2025},
}
</textarea>
</details></li>
<li><details>
<summary>
(2025). Regret analysis for randomized gaussian process upper confidence bound. <em>JAIR</em>, <em>84</em>. (<a href='https://doi.org/10.1613/jair.1.19393'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Gaussian process upper confidence bound (GP-UCB) is a theoretically established algorithm for Bayesian optimization (BO), where we assume the objective function ƒ follows a GP. One notable drawback of GP-UCB is that the theoretical confidence parameter β increases along with the iterations and is too large. To alleviate this drawback, this paper analyzes the randomized variant of GP-UCB called improved randomized GP-UCB (IRGP-UCB), which uses the confidence parameter generated from the shifted exponential distribution. We analyze the expected regret and conditional expected regret, where the expectation and the probability are taken respectively with ƒ and noise and with the randomness of the BO algorithm. In both regret analyses, IRGP-UCB achieves a sub-linear regret upper bound without increasing the confidence parameter if the input domain is finite. Furthermore, we show that randomization plays a key role in avoiding an increase in confidence parameter by showing that GP-UCB using a constant confidence parameter can incur linearly growing expected cumulative regret. Finally, we show numerical experiments using synthetic and benchmark functions and real-world emulators.},
  archive      = {J_JAIR},
  author       = {Shion Takeno and Yu Inatsu and Masayuki Karasuyama},
  doi          = {10.1613/jair.1.19393},
  journal      = {Journal of Artificial Intelligence Research},
  month        = {11},
  shortjournal = {J. Artif. Intell. Res.},
  title        = {Regret analysis for randomized gaussian process upper confidence bound},
  volume       = {84},
  year         = {2025},
}
</textarea>
