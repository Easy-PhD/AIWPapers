@article{ ,
  abstract = {Weak scale supersymmetry (SUSY) is highly appropriate in that it provides a technically natural ’t Hooft solution to the gauge hierarchy problem. However, recent strong limits from superparticle searches at LHC Run 2 may exacerbate the so-called little hierarchy problem, which is a matter of practical naturalness: why is ? Recent LHC and weakly interacting massive particle dark matter search bounds are reviewed, as is their impact on a variety of proposed SUSY models: gravity, gauge, anomaly, mirage, and gaugino mediation, along with dark matter proposals such as well-tempered neutralinos. The naturalness question is addressed. Also discussed is the emergence of the string landscape at the beginning of the 21st century and its impact on expectations for SUSY. Generally, the string landscape statistically prefers large soft SUSY breaking terms but is subject to the anthropic requirement that the derived value of the weak scale for each pocket universe within the greater multiverse lies within the Agrawal-Barr-Donoghue-Seckel window of values. This stringy natural approach implies that , more often than not with sparticles beyond or well-beyond present LHC search limits. Detailed reach calculations of the High-Luminosity LHC (HL-LHC) for nonuniversal Higgs mass models, which present perhaps the most plausible realization of SUSY from the string landscape, are reviewed. In contrast to conventional wisdom, from a stringy naturalness point of view, the search for SUSY at LHC has only just begun to explore the interesting regimes of parameter space. How nonuniversal Higgs models could be differentiated from other expressions of natural SUSY, such as natural anomaly mediation and natural mirage mediation at HL-LHC, is commented upon.},
