(2026). Analytical bifurcation analysis of mean-field ising models reveals connectivity as a risk factor for psychopathology. <em>JOMP</em>, <em>128</em>, 102968. (<a href='https://doi.org/10.1016/j.jmp.2025.102968'>www</a>)

<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {The connectivity hypothesis, central to the increasingly influential symptom network approach to psychopathology, proposes that stronger connectivity among symptoms heightens vulnerability to mental disorders. We provide an analytic derivation of this hypothesis using mean-field Ising models of depression, both in the standard − 1 / 1 formulation and in a 0 / 1 variant where nodes represent symptoms as absent or present. Applying bifurcation theory, we derive the bifurcation sets and phase transition structure directly from the mean-field equations. This formal characterization elucidates how connectivity shapes system dynamics and, consistent with the network theory of mental disorders, demonstrates that increasing connectivity amplifies the risk of transitions into unhealthy states.},
  archive      = {J_JOMP},
  author       = {Han L.J. van der Maas and Lourens Waldorp},
  doi          = {10.1016/j.jmp.2025.102968},
  journal      = {Journal of Mathematical Psychology},
  month        = {3},
  pages        = {102968},
  shortjournal = {J. Math. Psychol.},
  title        = {Analytical bifurcation analysis of mean-field ising models reveals connectivity as a risk factor for psychopathology},
  volume       = {128},
  year         = {2026},
}
</textarea>
</details></li>
<li><details>
<summary>
(2026). Identifiability of the polytomous local independence model with graded knowledge structures. <em>JOMP</em>, <em>128</em>, 102956. (<a href='https://doi.org/10.1016/j.jmp.2025.102956'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {This article provides initial theoretical results concerning the identifiability of the polytomous local independence model (PoLIM), which is an extension of the basic local independence model (BLIM) to polytomous knowledge structures. It is well-known that the BLIM is not identifiable for graded knowledge structures. This is because there exist parameter transformations, named outcome preserving transformations, that leave unchanged the outcome of the prediction function of the model. In this article a twofold generalization is carried out. On the one side, we extend the notion of gradedness to polytomous structures, and, on the other side, we generalize the outcome preserving transformations to the case of polytomous items. These generalizations lead to the conclusion that the PoLIM is not identifiable for graded polytomous structures. This result generalizes a well-known one with the dichotomous structures. The role of equally informative items in the identifiability of the PoLIM is also investigated. The formal results are accompanied by a numerical example that applies those results to the PoLIM with a concrete polytomous structure that turns out to be graded.},
  archive      = {J_JOMP},
  author       = {Luca Stefanutti and Andrea Spoto},
  doi          = {10.1016/j.jmp.2025.102956},
  journal      = {Journal of Mathematical Psychology},
  month        = {3},
  pages        = {102956},
  shortjournal = {J. Math. Psychol.},
  title        = {Identifiability of the polytomous local independence model with graded knowledge structures},
  volume       = {128},
  year         = {2026},
}
</textarea>
