(2026). A semi-parametric approach to receiver operating characteristic analysis with semi-continuous biomarker. <em>CSDA</em>, <em>216</em>, 108305. (<a href='https://doi.org/10.1016/j.csda.2025.108305'>www</a>)

<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {The receiver operating characteristic (ROC) curve and its summary measures, such as the area under the curve (AUC) and Youden index, are frequently used to evaluate the performance of a binary classifier based on data of a continuous biomarker and meanwhile identify a suitable cut-off point for classification. In clinical applications, the biomarker used for classification may be semi-continuous in the sense that the observations contain excess zero values and the distribution of the positive values is skewed. In this paper, the distribution of a semi-continuous biomarker is modeled using a mixture of a discrete mass at zero and a continuous skewed positive component. In addition, the distributions of the continuous component in subjects with true negative and positive outcomes are linked by a semi-parametric density ratio model to gain efficiency. Under this framework, unified estimation and inference procedures are proposed for the ROC curve, its important summary measures, and the associated cut-off point. The asymptotic properties of the proposed semi-parametric estimators are established and used to construct their corresponding confidence intervals. Simulation results demonstrate the desirable performance of these estimators and confidence intervals in various settings. The proposed semi-parametric approach is also applied to assess the semi-continuous BRCA1 biomarker as a valid prognostic biomarker for predicting cancer progression at 4 years and identifying a cut-off point to classify patients with advanced ovarian cancer into two groups with good and bad prognoses.},
  archive      = {J_CSDA},
  author       = {Baohao Wei and Dongsheng Tu and Chunlin Wang},
  doi          = {10.1016/j.csda.2025.108305},
  journal      = {Computational Statistics & Data Analysis},
  month        = {4},
  pages        = {108305},
  shortjournal = {Comput. Stat. Data Anal.},
  title        = {A semi-parametric approach to receiver operating characteristic analysis with semi-continuous biomarker},
  volume       = {216},
  year         = {2026},
}
</textarea>
</details></li>
<li><details>
<summary>
(2026). Sequential hierarchical bayesian model and particle filter estimation with two-step RJMCMC resampling. <em>CSDA</em>, <em>216</em>, 108304. (<a href='https://doi.org/10.1016/j.csda.2025.108304'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Data assimilation (DA) combines numerical model simulations with observed data to obtain the best possible description of a dynamical system and its uncertainty. Incorrect modeling assumptions can lead to filter divergence, making model identification an important issue in the field of DA. Variations in dynamic model structures can result in differences in parameter dimensions, complicating the resampling step in PFs. To meet this challenge, the Sequential Hierarchical Bayesian Model (SHBM) is proposed in this paper, which integrates the evolution model along with observation model from the DA scheme, and the hierarchical parameter model. A two-step resampling method are also proposed to estimate the SHBM: the first step uses the resampling scheme in the bootstrap filter to resample new particles based on weights, which may produce some duplicate particles; the second step utilizes the Reversible Jump Markov Chain Monte Carlo (RJMCMC) methods to draw new particles from the target distribution. This approach ensures particle diversity, with the first step aiming at avoiding particle degeneracy, and the second step intends to prevent the sample impoverishment. The performance in the Advection Equation example and Lorenz 96 example demonstrates the effectiveness of the proposed method.},
  archive      = {J_CSDA},
  author       = {Yue Huan and Guoqiang Wang and Hai Xiang Lin},
  doi          = {10.1016/j.csda.2025.108304},
  journal      = {Computational Statistics & Data Analysis},
  month        = {4},
  pages        = {108304},
  shortjournal = {Comput. Stat. Data Anal.},
  title        = {Sequential hierarchical bayesian model and particle filter estimation with two-step RJMCMC resampling},
  volume       = {216},
  year         = {2026},
}
</textarea>
