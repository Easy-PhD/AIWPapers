<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Chromosome classification is a critical yet challenging task in cytogenetics, particularly under small-data conditions where chromosome images often exhibit high similarity and shape deformation. To address this, we propose MSD-Rep, a novel representation learning-based framework that prioritizes the extraction of semantically rich and discriminative representations before classification. Inspired by the multi-resolution nature of microscopic observation, we design a Multi-Scale Convolution Block (MSCB) to capture both fine-grained and global features of chromosomes. Furthermore, we introduce Residual ReduNet Blocks (RRBs), which implement a representation refinement strategy derived from the Maximum Coding Rate Reduction principle, enhancing feature separability through iterative residual transformations. Comprehensive experiments on both public and private datasets demonstrate that MSD-Rep achieves superior accuracy (98.20 % and 99.02 %, respectively), even when trained on small or imbalanced datasets. Our approach also maintains low model complexity and fast inference speed, making it practical for real-world deployment. The results highlight the effectiveness of representation-driven modeling in small-data biomedical image analysis.},
  archive      = {J_KBS},
  author       = {Haoxi Zhang and Minghui Li and Yi Lai and Maiqi Wang and Linfeng Yu and Edward Szczerbicki},
  doi          = {10.1016/j.knosys.2025.114933},
  journal      = {Knowledge-Based Systems},
  month        = {1},
  pages        = {114933},
  shortjournal = {Knowl. Based Syst.},
  title        = {MSD-rep: Multi-scale discriminative representation learning for chromosome classification with small datasets},
  volume       = {333},
  year         = {2026},
}
</textarea>

</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Spiking neural networks (SNNs), which are third-generation neural networks inspired by biology, encode spatiotemporal dynamic information via spike signal transmission. Previous studies on event-based vision have achieved excellent detection performance in typical scenes; however, they encountered significant challenges in complex scenes. The spatiotemporal transmission characteristics of SNNs have emerged as a key solution for addressing the aforementioned challenges. Particularly, the binary spike communication characteristics of SNNs are highly suitable for event-based vision because they effectively avoid unnecessary computation and communication costs. Therefore, the use of SNNs for high-precision high-performance detection is crucial. Accordingly, we analyzed the performance limitations of existing spiking backbone networks to develop a new one called SpikeNeXt, which is a deep and directly trainable network that ensures effective temporal information transmission. Then, we theoretically discuss that SpikeNeXt could avoid gradient explosions or vanishing when attempting to extend the network depth. Based on this, we constructed an event-guided object-detection framework under spiking transmission, called EGSTNet, which attempts to train a deep SNN by using temporal event information to guide intensity images. We propose a novel fusion method called the event-visible integration fusion (EVI-Fuse) strategy, which utilizes measurement information from the event stream dimension, then applies adaptive integration to reconstruct high-frequency details from blurred frames. The fused output features can preserve both the texture details of visible images and the edge characteristics of events. The results demonstrate that our framework achieves a 28.7% mean average precision on the PKU-DAVIS-SOD automotive dataset within six epochs, indicating that our spiking-based framework achieves high communication efficiency and low energy consumption, surpassing the performance of traditional artificial neural networks. The code and pre-trained models are available at https://github.com/wang1239t/Event-Guide-Object-Detection-Under-Spiking-Transmission},
  archive      = {J_KBS},
  author       = {Hechong Wang and Shilong Jing and Chengshan Han and Yuchen Zhao and Hailong Liu and Hengyi Lv},
  doi          = {10.1016/j.knosys.2025.114776},
  journal      = {Knowledge-Based Systems},
  month        = {1},
  pages        = {114776},
  shortjournal = {Knowl. Based Syst.},
  title        = {Event-guided object detection under spiking transmission},
  volume       = {333},
  year         = {2026},
}
</textarea>
