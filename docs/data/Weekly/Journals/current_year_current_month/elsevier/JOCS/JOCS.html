<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {The paper proposes an algorithm for dividing a time series with a multimodal distribution into long continuous segments corresponding to one of the modes of its distribution. We call such division of the series the Segmentation. The algorithm is a two-level classifier of time series elements: an element belongs to a segment, and a segment is assigned to a certain class. Each class is associated with a peak in the original histogram constructed for all elements of the series. We associate each histogram peak with a certain set of stable external conditions (operating modes) that affect the behavior of the observed variable. This refers us to the definition of non-stationarity of a series if this non-stationarity can be represented as a mixture of some distributions. The main idea for constructing the algorithm is to treat the elements of the series corresponding to one mode as a sample from a unimodal distribution. The two-level classifier takes into account the temporal nature of the series, i.e. the ordering of its elements in contrast to the sample. The algorithm operates under the assumption that the distribution of data in each resulting class is close to normal. The article proposes testing the algorithm on synthetic and real data.},
  archive      = {J_JOCS},
  author       = {V.S. Petrakova and E.D. Karepova},
  doi          = {10.1016/j.jocs.2025.102765},
  journal      = {Journal of Computational Science},
  month        = {2},
  pages        = {102765},
  shortjournal = {J. Comput. Sci.},
  title        = {Algorithm for segmentation of multimodally distributed time series in accordance with their modes},
  volume       = {94},
  year         = {2026},
}
</textarea>
</details></li>
<li><details>
<summary>
(2026). A liquid neural network with physical evolution for variable continuous time series prediction. <em>JOCS</em>, <em>94</em>, 102757. (<a href='https://doi.org/10.1016/j.jocs.2025.102757'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {With the advantages of real-time computation and transparent decision-making process, Liquid time-constant neural networks (LTCs) perform well in modeling time-varying systems, but they also face problems such as the limitations of dependent learning capabilities and the adaptability to different data distributions. In order to improve the model learning performance, a liquid neural network with physical evolution for variable continuous time series prediction is proposed. Firstly, a simulation synaptic neural transmission model is combined with Hamilton evolution to establish a dynamic evolution model with physical states for neural information transfer. Then an explicit time-dependent Hamiltonian closed-form continuous-depth network (HCFC) is constructed to handle the transmission processing. The implicit Hamilton canonical equations are utilized to model the sophisticated nonlinear transformations experienced by the information as it propagates to the current neuron. The experimental results show that the HCFC model can improve the neural network dynamic property, enhance the learning performance, and provide superior performance in the prediction of complex continuous time series compared with the state-of-the-art (SOTA) methods.},
  archive      = {J_JOCS},
  author       = {Kui Qian and Yue Deng and Zhengyan Li and Xiulan Wen},
  doi          = {10.1016/j.jocs.2025.102757},
  journal      = {Journal of Computational Science},
  month        = {2},
  pages        = {102757},
  shortjournal = {J. Comput. Sci.},
  title        = {A liquid neural network with physical evolution for variable continuous time series prediction},
  volume       = {94},
  year         = {2026},
}
</textarea>
