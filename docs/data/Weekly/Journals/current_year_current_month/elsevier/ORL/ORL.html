<li><details>
<summary>
(2026). A frank-wolfe algorithm for strongly monotone variational inequalities. <em>ORL</em>, <em>65</em>, 107388. (<a href='https://doi.org/10.1016/j.orl.2025.107388'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {We propose an accelerated algorithm with a Frank-Wolfe method as an oracle for solving strongly monotone variational inequality problems. While standard solution approaches, such as projected gradient descent (aka value iteration), involve projecting onto the desired set at each iteration, a distinctive feature of our proposed method is the use of a linear minimization oracle in each iteration. This difference potentially reduces the projection cost, a factor that can become significant for certain sets or in high-dimensional problems. We validate the performance of the proposed algorithm on the traffic assignment problem, motivated by the fact that the projection complexity per iteration increases exponentially with respect to the number of links.},
  archive      = {J_ORL},
  author       = {Reza Rahimi Baghbadorani and Peyman Mohajerin Esfahani and Sergio Grammatico},
  doi          = {10.1016/j.orl.2025.107388},
  journal      = {Operations Research Letters},
  month        = {3},
  pages        = {107388},
  shortjournal = {Oper. Res. Lett.},
  title        = {A frank-wolfe algorithm for strongly monotone variational inequalities},
  volume       = {65},
  year         = {2026},
}
</textarea>
</details></li>
<li><details>
<summary>
(2026). A primal-dual algorithm for monotone submodular maximization. <em>ORL</em>, <em>65</em>, 107387. (<a href='https://doi.org/10.1016/j.orl.2025.107387'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {In this paper we design and analyze a new approximation algorithm for the classic discrete optimization problem of maximizing a monotone submodular function subject to a cardinality constraint. Our algorithm is based on the primal-dual schema and achieves the optimal factor of ( 1 − 1 / e ) . While greedy algorithms have been known to achieve this approximation factor, our algorithms also provide a dual certificate which upper bounds the optimum value of any instance. This certificate can be used to certify instance-wise guarantees potentially much better than the worst-case ( 1 − 1 / e ) approximation factor.},
  archive      = {J_ORL},
  author       = {Deeparnab Chakrabarty and Luc Coté},
  doi          = {10.1016/j.orl.2025.107387},
  journal      = {Operations Research Letters},
  month        = {3},
  pages        = {107387},
  shortjournal = {Oper. Res. Lett.},
  title        = {A primal-dual algorithm for monotone submodular maximization},
  volume       = {65},
  year         = {2026},
}
</textarea>
</details></li>
