@article{ ,
  abstract     = {In Multiple Criteria Decision Aid (MCDA), preference disaggregation is used to derive aggregation functions that replicate the preference information provided by decision makers (DMs). A key research challenge is identifying the most representative aggregation function that aligns with the DMs’ behavioral preferences from all feasible functions. In the context of group decisions and negotiations, preference disaggregation faces two main barriers: Selecting representative aggregation functions and reducing the cognitive effort required from DMs. In this paper, we extend preference disaggregation to group decision-making by enabling DMs to increase the diversity of their decision matrices, and establish several representative aggregation function selection models that account for group behavioral preferences. Given the cognitive limitations of DMs, their preferences are often expressed as confidence levels, which inherently involve uncertainty. Therefore, we expand the scope of preference information required for preference disaggregation from deterministic preferences to uncertain preferences. By applying probability theory–specifically, chance constraints–we transform DMs’ uncertain preferences into constraints for selecting representative aggregation functions that align with their behavioral preferences. Notably, when the confidence level approaches 100 %, the uncertain preferences converge to their deterministic counterparts, demonstrating the extensiveness and inclusiveness of uncertain preference information. Finally, we illustrate the practical feasibility of our approach through a case study on the evaluation of medical pension institutions.},
  archive      = {J_IJAR},
