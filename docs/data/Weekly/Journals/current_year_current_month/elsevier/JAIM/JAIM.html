(2026). On string functions of the generalized parafermionic theories, mock theta functions, and false theta functions. <em>JAIM</em>, <em>484</em>, 110684. (<a href='https://doi.org/10.1016/j.aim.2025.110684'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Kac and Wakimoto introduced the admissible highest weight representations as a conjectural classification of all modular-invariant representations of the affine Kac–Moody algebras. For the affine Kac–Moody algebra A 1 ( 1 ) their conjectural construction has been proved. Using Kac and Wakimoto's result, Ahn, Chung, and Tye introduced the generalized Fateev–Zamolodchikov parafermionic theories, whose chiral current algebras were recently studied as extensions of the parafermionic vertex operator algebra at admissible level. The characters of the parafermionic vertex operator algebra are string functions of A 1 ( 1 ) up to a simple appropriate factor. For the 1/2-level string functions, we present their mixed mock modular properties as well as elegant mock theta conjecture-like identities involving second-order mock theta functions from Ramanujan's Lost Notebook. In addition, we give an elementary proof that the negative level string functions can be evaluated in terms of false theta functions.},
  archive      = {J_JAIM},
  author       = {Nikolay E. Borozenets and Eric T. Mortenson},
  doi          = {10.1016/j.aim.2025.110684},
  journal      = {Advances in Mathematics},
  month        = {1},
  pages        = {110684},
  shortjournal = {Adv. Math.},
  title        = {On string functions of the generalized parafermionic theories, mock theta functions, and false theta functions},
  volume       = {484},
  year         = {2026},
}
</textarea>
</details></li>
<li><details>
<summary>
(2026). Three-phase muskat problem: Uniform lifespan with respect to the width of the strip between interfaces. <em>JAIM</em>, <em>484</em>, 110676. (<a href='https://doi.org/10.1016/j.aim.2025.110676'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {We consider the three-phase Muskat problem with different densities and the same viscosities. The lifespan of the solutions with respect to the width of the strip between interfaces is studied. Indeed, the interfaces are parameterized by the graph of two functions f ( x , t ) and g ( x , t ) and we impose that | | f ( ⋅ , 0 ) − g ( ⋅ , 0 ) | | L ∞ ≤ C σ and inf x ⁡ | f ( ⋅ , 0 ) − g ( ⋅ , 0 ) | ≥ c σ . It is shown, under stronger assumption on f ( x , 0 ) and g ( x , 0 ) , local existence independent of the parameter σ (with σ small enough). In order to prove such a result, we need to work in analytic spaces.},
  archive      = {J_JAIM},
  author       = {Ángel Castro and Liangchen Zou},
  doi          = {10.1016/j.aim.2025.110676},
  journal      = {Advances in Mathematics},
  month        = {1},
  pages        = {110676},
  shortjournal = {Adv. Math.},
  title        = {Three-phase muskat problem: Uniform lifespan with respect to the width of the strip between interfaces},
  volume       = {484},
  year         = {2026},
}
</textarea>
</details></li>
