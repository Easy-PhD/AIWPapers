(2026). Medical concept guided frequency representation for chest X-ray report generation. <em>CC</em>, <em>18</em>(1), 2--16. (<a href='https://doi.org/10.1007/s12559-025-10537-8'>www</a>)

<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Automatic chest X-ray report generation aims to alleviate radiologists’s workload by generating diagnostic narratives directly from medical images. Despite the progress driven by image captioning techniques, existing models often struggle to emulate the cognitive process of radiologists in identifying subtle pathological cues and establishing coherent visual-linguistic associations. The challenge lies in the limited capacity to perceive in the spatial domain and the semantic gap between visual representations and language generation. These cognitive mismatches frequently lead to inaccurate or incomplete reports. We propose a novel method named Medical Concept guided Frequency Representation (MCFeR), which leverages frequency-domain features to enhance the subtle visual details often overlooked in the spatial domain. MCFeR assigns medical concept tags to different frequency regions of the chest X-ray image, allowing the model to mine discriminative features guided by medical knowledge. Furthermore, to bridge the cross-modal semantic gap, MCFeR establishes associations between medical concepts and visual features by aligning concept tags with corresponding visual regions, thus promoting more coherent and semantically accurate report generation. Extensive experiments on two public datasets, IU-Xray and MIMIC-CXR, demonstrate that our method achieves competitive or superior performance compared to state-of-the-art approaches across various evaluation metrics. In addition, a human evaluation conducted by professional radiologists further confirms the clinical validity and readability of the reports generated by MCFeR. The experimental results show that our medical concept guided frequency representation method can effectively capture subtle visual differences in chest X-ray images and mitigate the semantic gap between visual and textual modalities. The experiments on IU-Xray and MIMIC-CXR datasets, as well as human evaluation by radiologists, illustrate the effectiveness of our method in improving the accuracy and clinical relevance of automatic chest X-ray report generation.},
  archive      = {J_CC},
  author       = {Huang, Lili and Zhao, Xiaowei and Liu, Xinyi and Li, Chenglong},
  doi          = {10.1007/s12559-025-10537-8},
  journal      = {Cognitive Computation},
  month        = {12},
  number       = {1},
  pages        = {2--16},
  shortjournal = {Cogn. Comput.},
  title        = {Medical concept guided frequency representation for chest X-ray report generation},
  volume       = {18},
  year         = {2026},
}

<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {The desire for comprehending user behavior is significant, since social media data is growing quickly owing to user contributions, especially in light of the recent coronavirus outbreak. In the literature works, several semantic analysis methodologies are used for examining the user behavior and emotions from the corpus data. They continue to deal with the main issues of poor accuracy, a complex system, inadequate emotion recognition, and ineffectiveness. The main objective of this paper is to build a new model for sentiment analysis and opinion mining. When compared to the conventional works, the novel concept behind this work is, it adopts some unique computational methodologies for accurate sentiment prediction. Here, a new Cycle Generative Adversarial Network (GAN) based Term Memory integrated Sentiment Analysis (CyG-TMSA) framework is developed for analyzing and classifying user emotions from corpus data. The most accurate identification of emotions is made possible by the efficient generation of augmented data using the Cycle Generative Adversarial Network (GAN) model. Moreover, a classification technique based on Term Memory Allocation (TMA) is applied to accurately predict opinions derived from the data supplementation. The best way to approximate the weight value for classifying data is to use the Elite Golden Jackle Optimization (EGJO) technique, which enhances the classifier’s decision-making ability. To verify and contrast the effectiveness and results of the suggested CyG-TAMS model, multiple corpus data sets extracted from public repositories are employed. The proposed CyG-TMSA framework demonstrated great effectiveness in sentiment analysis via CycleGAN-based data augmentation, TMA for precise classification, and optimization of parameter tuning through GJO. In experimental evaluations conducted on datasets extracted from Amazon and Twitter, the model obtained high accuracy at 98% within a very short processing time of 10.12 s, significantly outclassing other conventional methods in terms of accuracy and computational efficiency.},

  author       = {Arularasan, A. N. and Ganeshkumar, P. and Albalawi, Tahani and Alkhatib, Mohammad},

  journal      = {Cognitive Computation},
  month        = {12},
  number       = {1},

  shortjournal = {Cogn. Comput.},
  title        = {A radical cycle GAN based term memory integrated sentiment analysis (CyG-TMSA) framework for social media applications},

}
