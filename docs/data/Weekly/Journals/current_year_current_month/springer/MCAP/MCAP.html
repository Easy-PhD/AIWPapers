@article{ ,
  abstract     = {We study a single-server, infinite-buffer queueing system with bulk arrivals and state-dependent batch service governed by the Modified Bulk-Service Rule. In this model, entities arrive in random-sized batches, and service begins only when at least L entities are present. Unlike the traditional General Bulk-Service Rule, entities arriving during service may join theTa ongoing batch, provided the total does not exceed the maximum batch size K. The model is denoted as the $$M^X/M_{r}^{(L \rightarrow K)}/1$$ queue. Using the method of roots, we derive the joint probability generating function of the queue-length and the number of entities in service at an arbitrary epoch. Closed-form expressions for the marginal distributions of the number of entities in the queue, in the system, and with the server are obtained. Several performance measures are computed, and Little’s Law is verified. Numerical results are presented in the form of tables and graphs to illustrate the impact of system parameters and batch-size distributions.},
