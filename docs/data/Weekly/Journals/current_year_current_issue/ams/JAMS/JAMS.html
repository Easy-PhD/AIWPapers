<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {A Kakeya set is a compact subset of $\mathbb {R}^n$ that contains a unit line segment pointing in every direction. The Kakeya conjecture asserts that such sets must have Hausdorff and Minkowski dimension $n$. There is a special class of Kakeya sets, called sticky Kakeya sets. Sticky Kakeya sets exhibit an approximate multi-scale self-similarity, and sets of this type played an important role in Katz, Łaba, and Tao’s groundbreaking 2000 work on the Kakeya problem. We propose a special case of the Kakeya conjecture, which asserts that sticky Kakeya sets must have Hausdorff and Minkowski dimension $n$. We prove this conjecture in three dimensions.},
  archive      = {J_JAMS},
  author       = {Wang, Hong and Zahl, Joshua},
  doi          = {10.1090/jams/1067},
  journal      = {Journal of the American Mathematical Society},
  month        = {4},
  number       = {2},
  pages        = {515--585},
  shortjournal = {J. Am. Math. Soc.},
  title        = {Sticky kakeya sets and the sticky kakeya conjecture},
  volume       = {39},
  year         = {2026},
}
</textarea>

@article{ ,
  abstract     = {We continue the investigation of the distribution of $\ell ^{\infty }$-Selmer groups in degree $\ell$ twist families of Galois modules over number fields begun by the author in [J. Amer. Math. Soc. 39-1 (2026), pp. 1–72]. Building off the work on higher Selmer groups in that part, we find conditions under which we can compute the distribution of the $\ell ^{\infty }$-Selmer groups for a given degree $\ell$ twist family. Along the way, we show that the average rank in the quadratic twist family of any given abelian variety over a number field is bounded.},

<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {We associate a ring $R$ to a log Calabi-Yau pair $(X,D)$ or a degeneration of Calabi-Yau manifolds $X\to B$. The vector space underlying $R$ is determined by the tropicalization of $(X,D)$ or $X\to B$, while the product rule is defined using punctured Gromov-Witten invariants, defined in joint work with Abramovich and Chen. In the log Calabi-Yau case, if $D$ is maximally degenerate, then we propose that $\operatorname {Spec} R$ is the mirror to $X\setminus D$, while in the Calabi-Yau degeneration case, if the degeneration is maximally unipotent, the mirror is expected to be $\operatorname {Proj} R$. The main result in this paper is that $R$ as defined is an associative, commutative ring with unit, with associativity the most difficult part.},
  archive      = {J_JAMS},
  author       = {Gross, Mark and Siebert, Bernd},
  doi          = {10.1090/jams/1066},
  journal      = {Journal of the American Mathematical Society},
  month        = {4},

}
