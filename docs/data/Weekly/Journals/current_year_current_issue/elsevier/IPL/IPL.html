@article{ ,
  abstract     = {Given a directed graph G and two of its vertices s and t , the EvenPath problem is to find an even-length path from s to t . The decision version of EvenPath problem for general directed graphs was shown to be NP - complete by LaPaugh and Papadimitriou [1]. Thus, it makes sense to discover the classes of graphs for which the EvenPath problem can be solved efficiently. The EvenPath problem for directed planar graphs and directed single-crossing-minor-free graphs is known to be solvable in polynomial-time [2, 3]. In our work, we extend the classes of graphs for which the EvenPath problem can be solved in polynomial-time to directed single-crossing graphs. Our polynomial-time algorithm essentially reduces the EvenPath problem for a directed single-crossing graph to several instances of the EvenPath problem and 3- DisjointPaths problem for directed planar graphs.},
  archive      = {J_IPL},
  author       = {Archit Chauhan and Chetan Gupta and Vimal Raj Sharma},
