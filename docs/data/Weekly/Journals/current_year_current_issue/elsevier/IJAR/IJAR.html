(2026). Sweep transform on imaginary matrices and its application to parameter estimation with gaussian belief functions. <em>IJAR</em>, <em>190</em>, 109607. (<a href='https://doi.org/10.1016/j.ijar.2025.109607'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Gaussian belief functions admit matrix representations, with their combination reduced to matrix summation under Dempster’ s rule. However, the incorporation of deterministic and logic knowledge under ignorance introduces division-by-zero issues, often requiring symbolic calculus—a method that becomes intractable for large matrices. This paper proposes the sweep transform on imaginary matrices as a solution to this challenge and demonstrates its utility for parameter estimation by combining data represented as Gaussian belief functions. It advances the theory of sweep transforms by showing that, when extended to imaginary numbers, a sweep transform with a symmetric matrix as the pivot can be decomposed into a sequence of sweeps using the matrix’ s leading diagonal elements as pivots. Notably, such reducibility does not hold when restricted to real numbers. The result gives rises to a novel approach to inverting structured symmetric matrices, which may not be positive definite, without requiring permutations even in the presence of zero pivots.},
  archive      = {J_IJAR},
  author       = {Liping Liu},
  doi          = {10.1016/j.ijar.2025.109607},
  journal      = {International Journal of Approximate Reasoning},
  month        = {3},
  pages        = {109607},
  shortjournal = {Int. J. Approx. Reasoning},
  title        = {Sweep transform on imaginary matrices and its application to parameter estimation with gaussian belief functions},
  volume       = {190},
  year         = {2026},
}
</textarea>
</details></li>

</summary>

@article{ ,
  abstract     = {In this paper, we explore the use of General Unary Hypotheses Automaton quantifiers and provide representations for their specific subclasses. Furthermore, we focus explicitly on implicational quantifiers for analyzing specific relational dependencies. We discuss their suitability in fuzzy modeling and demonstrate their integration with appropriate fuzzy rules to create a new class of weighted fuzzy rules. This study contributes to the advancement of fuzzy modeling and offers a framework for further research and practical applications.},
  archive      = {J_IJAR},
  author       = {Martina Daňková and Dana Hliněná},
  doi          = {10.1016/j.ijar.2025.109600},
  journal      = {International Journal of Approximate Reasoning},

}
