@article{ ,
  abstract     = {To study natural convection problems in two-phase flows, a non-isothermal two-phase flow model incorporating differential viscosities and thermal diffusivities is considered and analyzed via the phase-field method. This modeling framework involves the multiphysics coupling of the Cahn-Hilliard phase field equations, heat transfer equation, and Navier-Stokes equations, resulting in a strongly nonlinear system. To efficiently solve the sophisticated system, we develop, analyze, and demonstrate a decoupled linear fully discrete scheme, which leverages the invariant energy quadratization strategy for the Cahn-Hilliard phase field system, the artificial compressibility method without artificial pressure boundary condition, an explicit-implicit treatment of nonlinear terms, and the addition of several key stabilization terms. This scheme is proven uniquely solvable per time step and unconditionally stable. A range of 2D and 3D numerical simulations, including accuracy tests, stability tests, interface pinchoff, one or two non-isothermal air bubbles rising, Rayleigh-Taylor instability, and thermal plumes, are carried out to illustrate the model and algorithm’s features and broad applicability.},
  archive      = {J_CMAME},
  author       = {Jian Li and Chunhao Chen and Xiaoyong Chen and Rui Li and Xiaoming He},
  doi          = {10.1016/j.cma.2025.118669},
  journal      = {Computer Methods in Applied Mechanics and Engineering},
  month        = {4},
  pages        = {118669},
  shortjournal = {Comput. Meth. Appl. Mech. Eng.},
  title        = {A fully discrete decoupled scheme and applications for non-isothermal two-phase flow model with different viscosities and thermal diffusivities},
  volume       = {451},

}
