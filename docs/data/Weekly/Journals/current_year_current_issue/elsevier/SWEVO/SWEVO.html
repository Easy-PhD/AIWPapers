<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Decomposition-based multi-objective evolutionary algorithms often suffer from premature convergence when dealing with complex Pareto fronts. To address this issue, this paper proposes a decomposition-based bi-optional optimization algorithm (MOEA/D-BOS). The proposed method integrates the SPEA-II selection mechanism and an individual exploration strategy into the MOEA/D framework to enhance population diversity and information retention. In addition, a new weight vector generation method and a scalarization function are designed to improve the uniformity of solution distribution. Benchmark experiments demonstrate that, compared with several advanced algorithms, MOEA/D-BOS achieves superior performance in terms of both convergence speed and population diversity.},
  archive      = {J_SWEVO},
  author       = {Qinwei Fan and Dewei Yang and Jigen Peng and Haiyang Li and Jian Wang and Aoxue Yin},
  doi          = {10.1016/j.swevo.2025.102228},
  journal      = {Swarm and Evolutionary Computation},
  month        = {1},
  pages        = {102228},
  shortjournal = {Swarm Evol. Comput.},
  title        = {Decomposition-based multi-objective evolutionary algorithm for bi-optimal selection},
  volume       = {100},
  year         = {2026},
}
</textarea>

<li><details>
<summary>
(2026). Partition-informed ant colony optimization for min–max multiple TSP. <em>SWEVO</em>, <em>100</em>, 102224. (<a href='https://doi.org/10.1016/j.swevo.2025.102224'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {The multiple traveling salesmen problem (mTSP) generalizes the classical TSP by involving multiple travelers who must collectively visit all cities, starting and ending at a common depot. This work focuses on the min–max variant, where the objective is to minimize the length of the longest subtour, ensuring a balanced workload among travelers, which is a crucial factor in many real-world applications, such as emergency response and logistics. This paper proposes a novel Ant Colony System (ACS)-based approach that effectively addresses the min–max mTSP, designed to construct well-balanced tours while optimizing the maximum tour length. The method integrates two key strategies: a sector-based heuristic for guiding city assignments, and a dynamic traveler selection criterion to promote equitable route construction. The method was evaluated on 33 two-dimensional Euclidean benchmark instances and compared with four state-of-the-art ACO-based approaches, demonstrating consistently better fitness under the min–max objective.},
  archive      = {J_SWEVO},
  author       = {Sara Pérez-Carabaza and Akemi Gálvez and Andrés Iglesias},
  doi          = {10.1016/j.swevo.2025.102224},
  journal      = {Swarm and Evolutionary Computation},
  month        = {1},
  pages        = {102224},
  shortjournal = {Swarm Evol. Comput.},
  title        = {Partition-informed ant colony optimization for min–max multiple TSP},
  volume       = {100},
  year         = {2026},
}
