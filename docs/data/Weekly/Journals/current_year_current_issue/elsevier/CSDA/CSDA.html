<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {A general class of seasonal autoregressive integrated moving average models (SARIMA), whose period is an independent and identically distributed random process valued in a finite set, is proposed. This class of models is named random period seasonal ARIMA (SARIMAR). Attention is focused on three subsets of them: the random period seasonal autoregressive (SARR) models, the random period seasonal moving average (SMAR) models and the random period seasonal autoregressive moving average (SARMAR) models. First, the causality, invertibility, and autocovariance shape of these models are revealed. Then, the estimation of the model components (coefficients, innovation variance, probability distribution of the period, (unobserved) sample-path of the random period) is carried out using the Expectation-Maximization algorithm. In addition, a procedure for random elimination of seasonality is developed. A simulation study is conducted to assess the estimation accuracy of the proposed algorithmic scheme. Finally, the usefulness of the proposed methodology is illustrated with two applications about the annual Wolf sunspot numbers and the Canadian lynx data.},
  archive      = {J_CSDA},
  author       = {Abdelhakim Aknouche and Stefanos Dimitrakopoulos and Nadia Rabehi},
  doi          = {10.1016/j.csda.2025.108320},
  journal      = {Computational Statistics & Data Analysis},
  month        = {5},
  pages        = {108320},
  shortjournal = {Comput. Stat. Data Anal.},
  title        = {Seasonal ARIMA models with a random period},
  volume       = {217},
  year         = {2026},
}
</textarea>
</details></li>
<li><details>
<summary>
(2026). Debiased quantile significance testing with machine learning methods. <em>CSDA</em>, <em>217</em>, 108319. (<a href='https://doi.org/10.1016/j.csda.2025.108319'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Testing the significance of a subset of covariates for a response is a critical problem with broad applications. A novel nonparametric significance testing procedure is developed to test whether a set of target covariates provides incremental information about the conditional quantile of the response given the other covariates. The proposed test statistics are constructed within the framework of debiased machine learning, which enables flexible estimation of unknown functions by leveraging machine learning methods. The asymptotic properties of the proposed test statistic under the null hypothesis are established, and the power under the alternatives is analyzed, demonstrating the ability of the procedure to detect local alternatives at the optimal parametric rate. To further enhance power, an ensemble quantile significance testing procedure is introduced. Extensive numerical studies and real data applications are conducted to illustrate the finite-sample performance of the proposed testing procedures.},
  archive      = {J_CSDA},
  author       = {Jiarong Ding and Yanmei Shi and Niwen Zhou and Mei Yao and Xu Guo},
  doi          = {10.1016/j.csda.2025.108319},
  journal      = {Computational Statistics & Data Analysis},
  month        = {5},
  pages        = {108319},
  shortjournal = {Comput. Stat. Data Anal.},
  title        = {Debiased quantile significance testing with machine learning methods},
  volume       = {217},
  year         = {2026},
}
