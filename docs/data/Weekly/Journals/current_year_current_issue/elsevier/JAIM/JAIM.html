<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {In 1984, Ditor asked two questions: (A) For each n ∈ ω and infinite cardinal κ , is there a join-semilattice of breadth n + 1 and cardinality κ + n whose principal ideals have cardinality < κ ? (B) For each n ∈ ω , is there a lower finite lattice of cardinality ℵ n whose elements have at most n + 1 lower covers? We show that both questions have positive answers under the axiom of constructibility, and hence consistently with ZFC . More specifically, we derive the positive answers from assuming that □ κ holds for enough κ 's.},
  archive      = {J_JAIM},
  author       = {Lorenzo Notaro},
  doi          = {10.1016/j.aim.2025.110714},
  journal      = {Advances in Mathematics},
  month        = {2},
  pages        = {110714},
  shortjournal = {Adv. Math.},
  title        = {Ladders and squares},
  volume       = {485},
  year         = {2026},
}
</textarea>
</details></li>
<li><details>
<summary>
(2026). Rauzy fractals of random substitutions. <em>JAIM</em>, <em>485</em>, 110713. (<a href='https://doi.org/10.1016/j.aim.2025.110713'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {We develop a theory of Rauzy fractals for random substitutions, which are a generalisation of deterministic substitutions where the substituted image of a letter is determined by a Markov process. We show that a Rauzy fractal can be associated with a given random substitution in a canonical manner, under natural assumptions on the random substitution. Further, we show the existence of a natural measure supported on the Rauzy fractal, which we call the Rauzy measure, that captures geometric and dynamical information. We provide several different constructions for the Rauzy fractal and Rauzy measure, which we show coincide, and ascertain various analytic, dynamical and geometric properties. While the Rauzy fractal is independent of the choice of (non-degenerate) probabilities assigned to a given random substitution, the Rauzy measure captures the explicit choice of probabilities. Moreover, Rauzy measures vary continuously with the choice of probabilities, thus provide a natural means of interpolating between Rauzy fractals of deterministic substitutions. Additionally, we highlight connections between Rauzy fractals and Rauzy measures of random substitutions and related S-adic systems.},
  archive      = {J_JAIM},
  author       = {P. Gohlke and A. Mitchell and D. Rust and T. Samuel},
  doi          = {10.1016/j.aim.2025.110713},
  journal      = {Advances in Mathematics},
  month        = {2},
  pages        = {110713},
  shortjournal = {Adv. Math.},
  title        = {Rauzy fractals of random substitutions},
  volume       = {485},
  year         = {2026},
}
</textarea>
</details></li>
<li><details>
<summary>
(2026). Exchange matrices of I-boxes. <em>JAIM</em>, <em>485</em>, 110711. (<a href='https://doi.org/10.1016/j.aim.2025.110711'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Admissible chains of i -boxes are important combinatorial tools in the monoidal categorification of cluster algebras, as they provide seeds of the cluster algebra. In this paper, we explore the properties of maximal commuting families of i -boxes in a more general setting, and define a certain matrix associated with such a family, which we call the exchange matrix. It turns out that, when considering the cluster algebra structure on the Grothendieck rings, this matrix is indeed the exchange matrix of the seed associated with the family, both in certain categories of modules over quantum affine algebras and over quiver Hecke algebras. We prove this by constructing explicit short exact sequences that represent the mutation relations.},
  archive      = {J_JAIM},
  author       = {Masaki Kashiwara and Myungho Kim},
  doi          = {10.1016/j.aim.2025.110711},
  journal      = {Advances in Mathematics},
  month        = {2},
  pages        = {110711},
  shortjournal = {Adv. Math.},
  title        = {Exchange matrices of I-boxes},
  volume       = {485},
  year         = {2026},
}
</textarea>
</details></li>
