<ul>
<li><details>
<summary>
(2026). Macroscopic reconstruction of the lattice boltzmann model for incompressible flows. <em>CMA</em>, <em>204</em>, 24--51. (<a href='https://doi.org/10.1016/j.camwa.2025.12.001'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {The present work proposes a general framework that combines the good numerical stability of the lattice Boltzmann model for incompressible flows (LBM-IF) and the flexibility of finite difference/volume methods in using nonuniform meshes and removing higher-order deviation terms. By adopting the second-order non-equilibrium moment as fundamental variables and neglecting higher-order non-equilibrium moments, to approximately increase entropy in the collision process, the non-equilibrium-moment-based macroscopic equations of LBM-IF are derived. Numerical investigations demonstrate that discretized equations can achieve even better numerical stability than the single-relaxation-time LBM-IF. It is concluded that the good numerical stability of LBM-IF can be roughly interpreted as the entropy increase of the collision step and the diffusion process of the streaming step. However, the discretized non-equilibrium-moments-based macroscopic equations are found to have significant numerical errors at a fixed Reynolds number and very small kinematic viscosities. By combining the non-equilibrium-moments-based and equilibrium-moments-based macroscopic equations, the paper proposes a hybrid model that achieves good numerical stability and accuracy for both small and large kinematic viscosities, even for inviscid flow. The deviation term in the recovered momentum equation of LBM-IF can be easily removed in the hybrid model. Compared with LBM-IF, finite difference/volume solvers based on the hybrid model exhibit better numerical stability and accuracy, as well as superior efficiency in simulations using nonuniform meshes.},
  archive      = {J_CMA},
  author       = {Jinhua Lu and Nikolaus A. Adams},
  doi          = {10.1016/j.camwa.2025.12.001},
  journal      = {Computers & Mathematics with Applications},
  month        = {2},
  pages        = {24--51},
  shortjournal = {Comput. Meth. Appl.},
  title        = {Macroscopic reconstruction of the lattice boltzmann model for incompressible flows},
  volume       = {204},
  year         = {2026},
}
</textarea>
</details></li>
<li><details>
<summary>
(2026). Nonlocal multiplicative denoising method based on variational approach and topological shape optimization. <em>CMA</em>, <em>204</em>, 1--23. (<a href='https://doi.org/10.1016/j.camwa.2025.11.024'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {In this work we propose multiplicative image denoising methods that are based on variational methods and topological shape optimization techniques. First, we extend a total variation-based multiplicative denoising approach to the W 1, p Sobolev space using the p-Dirichlet integral as a regularizer. We then formulate the new denoising problem as a topological shape optimization problem, which is solved using a generalized adjoint method. We propose a nonlocal denoising method that works on patch-by-patch basis thanks to the useful information given by the topological sensitivity, which is explicitly provided. Obtained numerical experiments on speckled and SAR images show neat qualitative and quantitative improvements of the proposed methods, especially in very noisy environments. Results show that the nonlocal method performs better than other denoising approaches in comparison.},
  archive      = {J_CMA},
  author       = {El Hadji S. Diop},
  doi          = {10.1016/j.camwa.2025.11.024},
  journal      = {Computers & Mathematics with Applications},
  month        = {2},
  pages        = {1--23},
  shortjournal = {Comput. Meth. Appl.},
  title        = {Nonlocal multiplicative denoising method based on variational approach and topological shape optimization},
  volume       = {204},
  year         = {2026},
}
</textarea>
</details></li>
