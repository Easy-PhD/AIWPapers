<summary>
(2026). An electrostatic model for the roots of discrete classical orthogonal polynomials. <em>JAT</em>, <em>315</em>, 106256. (<a href='https://doi.org/10.1016/j.jat.2025.106256'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {An electrostatic model is presented to describe the behaviour of the roots of classical discrete orthogonal polynomials. Indeed, this model applies more generally to the roots of polynomial solutions of second-order linear difference equations A Δ h ∇ h y + B Δ h y + C y = 0 where A , B and C are polynomials and Δ h f ( x ) = f ( x + h ) − f ( x ) and ∇ h f ( x ) = f ( x ) − f ( x − h ) with h > 0 . The existence of a unique distribution of points which minimizes the energy of the system is guaranteed under some assumptions on A and B . Furthermore, interlacing properties and the monotonicity of the roots depending on the parameters which appear in the difference equation are obtained from this electrostatic model.},
  archive      = {J_JAT},
  author       = {Joaquín Sánchez-Lara},
  doi          = {10.1016/j.jat.2025.106256},
  journal      = {Journal of Approximation Theory},
  month        = {5},
  pages        = {106256},
  shortjournal = {J. Approx. Theory},
  title        = {An electrostatic model for the roots of discrete classical orthogonal polynomials},
  volume       = {315},
  year         = {2026},
}
</textarea>
</details></li>
<li><details>
<summary>
(2026). Smoothness and time–frequency analysis in Sobolev–Besicovitch spaces of almost periodic functions. <em>JAT</em>, <em>315</em>, 106255. (<a href='https://doi.org/10.1016/j.jat.2025.106255'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Here, smoothness analysis of almost periodic functions is studied. Analogously to the case of L 2 ( R ) , the smoothness of the class of Besicovitch almost periodic functions is measured in a classic form by controlling, in some sense, the increments f ( x + h ) − f ( x ) and in a dual form by the decay of its Fourier–Bohr transform or by its approximation properties. The same problem is also treated considering the time–frequency representation given by the Gabor transform. Some results are given as equivalence of norms between appropriate function spaces.},
  archive      = {J_JAT},
  author       = {Juan Miguel Medina and Hernán D. Centeno and Raúl F. Florentín and Mónica Miralles},
  doi          = {10.1016/j.jat.2025.106255},
  journal      = {Journal of Approximation Theory},
  month        = {5},
  pages        = {106255},
  shortjournal = {J. Approx. Theory},
  title        = {Smoothness and time–frequency analysis in Sobolev–Besicovitch spaces of almost periodic functions},
  volume       = {315},
  year         = {2026},
}
</textarea>
