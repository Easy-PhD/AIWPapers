(2025). Passive inverse obstacle scattering problems for the helmholtz equation. <em>SIAP</em>, <em>85</em>(6), 2486--2507. (<a href='https://doi.org/10.1137/24M1701812'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Abstract. Passive imaging involves recording waves generated by uncontrolled, random sources and utilizing correlations of such waves to image the medium through which they propagate. In this paper, we focus on passive inverse obstacle scattering problems governed by the Helmholtz equation in . The random source is modeled by a Gaussian random process. Uniqueness results are established for the inverse problems to determine the source strength or shape and location of an obstacle, or both of them simultaneously from near-field correlation measurements. Finally, we present efficient methods for numerical reconstructions.},
  archive      = {J_SIAP},
  author       = {Thorsten Hohage and Meng Liu},
  doi          = {10.1137/24M1701812},
  journal      = {SIAM Journal on Applied Mathematics},
  month        = {12},
  number       = {6},
  pages        = {2486--2507},
  shortjournal = {SIAM J. Appl. Math.},
  title        = {Passive inverse obstacle scattering problems for the helmholtz equation},
  volume       = {85},
  year         = {2025},
}
</textarea>
</details></li>
<li><details>
<summary>
(2025). Evolutionary attractors in the chemostat model. <em>SIAP</em>, <em>85</em>(6), 2459--2485. (<a href='https://doi.org/10.1137/24M1706001'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Abstract. We consider the evolutive chemostat model with a continuous phenotypic trait of the microorganisms that impacts both the specific growth rate and the yield conversion, and whose evolution is driven by a mutation kernel. We study the evolutionary attractors (EAs) for a general class of nonlinear growth functions, without assuming that the dynamics of the resource is fast compared to the growth. We generalize the well-known reproduction number as a function of the trait, and show a concentration of the asymptotic state on values of the trait that maximize the reproduction number. However, in the case of multiple maxima, we show that the system can have a unique globally stable EA, depending on a total order defined on the trait values.},
  archive      = {J_SIAP},
  author       = {Ramsès Djidjou-Demasse and Ousmane Seydi and Alain Rapaport},
  doi          = {10.1137/24M1706001},
  journal      = {SIAM Journal on Applied Mathematics},
  month        = {12},
  number       = {6},
  pages        = {2459--2485},
  shortjournal = {SIAM J. Appl. Math.},
  title        = {Evolutionary attractors in the chemostat model},
  volume       = {85},
  year         = {2025},
}
</textarea>
</details></li>
