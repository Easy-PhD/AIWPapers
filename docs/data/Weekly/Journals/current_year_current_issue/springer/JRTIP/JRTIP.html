<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {In recent years, traffic participant detection (TPD) has become an essential but challenging task in domains, such as urban management and autonomous driving. While deep learning-based object detection algorithms have shown promising performance in this area, existing algorithms face challenges with meeting real-time requirements, excessive parameter counts, and the accurate detection of multiple traffic participants. To address these challenges, we propose a novel traffic participant detector (TPD–YOLO). Initially, we integrate a detailed feature enhancement module (DFEM) into the neck structure, which enhances the ability to extract spatially detailed feature information. Subsequently, the enhanced features generated by DFEM are fed into a high-resolution small object detection head (SHead) to enrich the feature representation. Finally, the channel-wise histogram feature distillation (CHFD) compression strategy is employed to enable the student model to approximate the performance of the teacher model while requiring fewer parameters and computational resources. We validated the proposed method on the SEU_PML data set and further evaluated the model’s generalization performance on the VisDrone2019 data set. Experimental results demonstrate that the proposed TPD–YOLO achieves 73.7% mAP on the SEU_PML data set with only 3.2M parameters. Furthermore, the model achieves inference speeds of 144.9 FPS, maintaining a balance between accuracy and efficiency. This research provides an advanced small object detection solution for real-time requirements in traffic scenarios (≥ 30 FPS), offering a more effective approach to urban traffic management.},
  archive      = {J_JRTIP},
  author       = {An, Fei and Zhong, MingEn and Zhang, Yihong and Yuan, Bingan and Tan, Jiawei and Fan, Kang},
  doi          = {10.1007/s11554-025-01829-1},
  journal      = {Journal of Real-Time Image Processing},
  month        = {2},
  number       = {1},
  pages        = {35--14},
  shortjournal = {J. Real-Time Image Process.},
  title        = {TPD–YOLO: Real-time traffic participant detection based on an improved feature distillation strategy},
  volume       = {23},
  year         = {2026},
}
</textarea>

(2026). YOLO11-MGNB: Lightweight real-time small object detection algorithm for UAV remote sensing images. <em>JRTIP</em>, <em>23</em>(1), 34--18. (<a href='https://doi.org/10.1007/s11554-025-01833-5'>www</a>)

<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {To address critical challenges in UAV remote sensing small object detection–including weak feature representation, high background interference sensitivity, insufficient edge localization precision, and the accuracy–efficiency trade-off–this paper proposes YOLO11-MGNB, an enhanced algorithm based on the YOLO11 framework. The solution integrates four key innovations: (1) A multi-scale small object enhancement architecture is designed, which preserves fine-grained details of small targets through space-to-depth convolution transformation. Integrated with the adaptive multi-scale kernel fusion module, it achieves cross-domain feature interaction, enhancing micro-target representation while avoiding the high computational overhead of traditional P2 detection layers; (2) A global edge information propagator module enabling multi-level fusion of shallow edge features and deep semantics to enhance boundary sensitivity; (3) Normalized Wasserstein distance loss optimization to refine small target localization; (4) A bi-level routing attention mechanism constructing global–local collaborative screening to suppress complex background interference. Experimental results on the DIOR and VisDrone2019 datasets demonstrate that YOLO11-MGNB achieves highly competitive accuracy (87.7% and 32.0% mAP50, respectively) while maintaining ultra-lightweight characteristics of only 3.7 M parameters and 13.6 GFLOPs. More importantly, with an inference speed of 333.3 frames per second (FPS), it is considerably faster than other state-of-the-art models, e.g., 238.1 FPS higher than YOLO-MS and 272.4 FPS higher than SMA-YOLO, providing a superior solution for high-precision real-time detection in UAV remote sensing applications.},
  archive      = {J_JRTIP},
  author       = {Ren, Weijie and Zhang, Shuailong and Zhou, Zhike},
  doi          = {10.1007/s11554-025-01833-5},
  journal      = {Journal of Real-Time Image Processing},

  title        = {YOLO11-MGNB: Lightweight real-time small object detection algorithm for UAV remote sensing images},

}
