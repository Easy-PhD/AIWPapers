<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {A k-injective-edge coloring of a graph G is an edge coloring c: $$E(G)\rightarrow \{1,2,\cdots ,k\}$$ , such that if $$e_{1}$$ , $$e_{2}$$ and $$e_{3}$$ are three consecutive edges in G, then $$c(e_{1})\ne c(e_{3})$$ , where $$e_{1}$$ , $$e_{2}$$ and $$e_{3}$$ are consecutive if they form a path or a cycle of length 3. The minimum integer k such that G has a k-injective-edge coloring is called the injective chromatic index of G, denoted by $$\chi '_{i}(G)$$ . The maximum average degree of G, denoted by mad(G), is defined to be the maximum average over all subgraphs H of G. In this paper, I will consider the injective edge coloring of sparse graph G with maximum degree 5. I get that (1) if mad $$(G)<\frac{31}{8}$$ , then $$\chi '_{i}(G)\le 20$$ ; (2) if mad $$(G)<4$$ , then $$\chi '_{i}(G)\le 21$$ .},
  archive      = {J_JCO},
  author       = {Wu, Yanqing},
  doi          = {10.1007/s10878-025-01362-8},
  journal      = {Journal of Combinatorial Optimization},
  month        = {11},
  number       = {4},
  pages        = {1-21},
  shortjournal = {J. Comb. Optim.},
  title        = {On injective edge coloring of sparse graphs with maximum degree 5},
  volume       = {50},
  year         = {2025},
}
</textarea>

<li><details>
<summary>
(2025). A quantum genetic algorithm for a parallel machine scheduling problem. <em>JCO</em>, <em>50</em>(4), 1-22. (<a href='https://doi.org/10.1007/s10878-025-01347-7'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Scheduling problems are a common challenge across various industries. This paper addresses a specific problem arising in printed circuit board (PCB) assembly: the parallel machines scheduling problem with sequence-dependent setup times. To address this challenge, we propose a hybrid quantum genetic algorithm (QGA) designed to solve this problem on an error-free quantum computer. The development focuses on three key aspects: efficient adaptability of the quantum circuit to different problem instances, feasibility of the measured circuit outputs, and efficient utilization of qubits. To compare the quantum algorithm with its purely classical counterpart, we introduce a novel key performance indicator to quantify a potential quantum speedup. Furthermore, we evaluate the convergence behavior of the solver across various problem instances. Our results demonstrate that the QGA exhibits strong convergence behavior, resulting in near-optimal solutions. Additionally, we identify a potential quantum advantage for solving this practical problem. The advantage increases as the population size grows.},
  archive      = {J_JCO},
  author       = {Schwenzow, Tilmann and Lehnert, Annika and Liebrecht, Christoph and Franke, Jörg and Reitelshöfer, Sebastian},
  doi          = {10.1007/s10878-025-01347-7},
  journal      = {Journal of Combinatorial Optimization},
  month        = {11},
  number       = {4},
  pages        = {1-22},
  shortjournal = {J. Comb. Optim.},
  title        = {A quantum genetic algorithm for a parallel machine scheduling problem},
  volume       = {50},
  year         = {2025},
}
</textarea>
