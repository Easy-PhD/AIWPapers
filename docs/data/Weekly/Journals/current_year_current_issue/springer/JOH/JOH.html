<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Rostering problems in healthcare mainly involve the optimal allocation of providers, such as physicians and nurses, to work shifts while considering various constraints, including coverage needs, operational requirements, and providers’ personal preferences. This is often a challenging task to solve, and a metaheuristic method that has started increasing attention is the Variable Neighborhood Search (VNS). Despite some evidence on the use of VNS in healthcare, no systematic reviews have comprehensively focused on rostering healthcare providers. Therefore, this study aims to fill this knowledge gap and conduct a comprehensive analysis of VNS in a specific healthcare rostering context. In total, 30 articles published between 2008 and 2025 were selected for analysis. The articles were further examined for their research objectives, VNS algorithm designs, and experimental results. The results indicated various applications of VNS in rostering problems, such as multi-objective provider rostering, healthcare provider rostering with preferences, and provider rostering with flexible working hours. Furthermore, our analysis examines the solution approaches, underlying assumptions of the proposed models, and the design of numerical experiments reported in the studies. This systematic review underscores the effectiveness of VNS in addressing rostering problems and identifies potential directions for future research aimed at improving both model formulations and solution methodologies.},
  archive      = {J_JOH},
  author       = {Abdelwanis, Moustafa and Ouda, Eman and Absi, Dima Al and Rahmadani, Firda and Simsekler, Mecit Can Emre and Sleptchenko, Andrei},
  doi          = {10.1007/s10732-025-09574-1},
  journal      = {Journal of Heuristics},
  month        = {3},
  number       = {1},
  pages        = {2--25},
  shortjournal = {J. Heuristics},
  title        = {Variable neighborhood search for healthcare providers rostering: A comprehensive review and future research agenda},
  volume       = {32},
  year         = {2026},
}
</textarea>

<summary>
(2026). Improving state-of-the-art vertex sorting algorithms to compute the maximum common induced subgraph. <em>JOH</em>, <em>32</em>(1), 1--33. (<a href='https://doi.org/10.1007/s10732-025-09575-0'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {The Maximum Common Induced Subgraph problem is a longstanding challenge in graph theory and combinatorial optimization, recognized for being NP-complete and its applications across chemistry, network analysis, and pattern recognition. State-of-the-art methods, such as the McSplit algorithm and its successors, employ a recursive branch-and-bound procedure to navigate the vast solution space. The efficiency of this search is critically dependent on the initial vertex sorting heuristic, which not only guides the algorithm toward a good solution but also structures the search tree for the computationally intensive proof of optimality. The original algorithm relies on a simple node degree heuristic, which is often suboptimal. This paper systematically investigates the influence of alternative vertex-ordering heuristics on McSplitDAL, a state-of-the-art variant of McSplit. We integrate five node-ranking heuristics (namely, PageRank, Betweenness Centrality, Closeness Centrality, Local Clustering Coefficient, and a modified Katz Centrality) into the McSplitDAL framework. We analyze their effect on search-space exploration, pruning efficiency, convergence behavior, and execution speed. We also investigate how they shape the algorithmic search and affect the solver’s ability to approach or prove optimality under constrained computational budgets. Experimental results across heterogeneous datasets reveal that specific heuristics, such as PageRank and Katz Centrality, consistently promote more effective pruning and higher-quality intermediate solutions, offering valuable insights into the relationship between graph topology-derived measures and branch-and-bound performance.},
  archive      = {J_JOH},
  author       = {Calabrese, Andrea and Cardone, Lorenzo and Licata, Salvatore and Porro, Marco and Quer, Stefano},
  doi          = {10.1007/s10732-025-09575-0},
  journal      = {Journal of Heuristics},
  month        = {3},
  number       = {1},
  pages        = {1--33},
  shortjournal = {J. Heuristics},
  title        = {Improving state-of-the-art vertex sorting algorithms to compute the maximum common induced subgraph},
  volume       = {32},
  year         = {2026},
}
</textarea>
