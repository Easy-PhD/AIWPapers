<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Estimating individualized treatment effects (ITE) in causal inference mainly relies on the assumption of strong ignorability, which is often difficult to validate in practice. Moreover, the true value of ITE is unobservable. These factors make it difficult to obtain an appropriate loss function to estimate the ITE. In this paper, a novel framework that leverages generative adversarial networks (GANs) is proposed to estimate ITE using a bounded loss function under the strong ignorability condition. The bound is obtained based on the supervised loss due to the generator, and the unsupervised loss is due to the discriminator. In the proposed method, the discriminator estimates the conditional density of the estimated unobserved outcome and the conditional density of the observed outcome. The discrepancy between these conditional densities accounts for the unsupervised loss. Furthermore, we developed the Compromised Adversarial Network (ITE-CAN), an advanced ensemble model specifically designed to mitigate common limitations of GANs, such as mode collapse. The theoretical foundation of ITE-CAN is established through a series of theorems that validate its efficacy. Through extensive simulations and empirical analysis on two benchmark datasets, we demonstrate that ITE-CAN consistently outperforms existing methods in terms of estimation accuracy at the individual level. This contribution underscores the significance of our approach in enhancing the precision of individualized treatment effect estimation.},
  archive      = {J_CSTAT},
  author       = {Abdisa, Atomsa Gemechu and Zhou, Yingchun and Qiu, Yuqi},
  doi          = {10.1007/s00180-025-01705-3},
  journal      = {Computational Statistics},
  month        = {1},
  number       = {1},
  pages        = {2--27},
  shortjournal = {Comput. Stat.},
  title        = {Individualized treatment effect estimation with compromised adversarial nets},
  volume       = {41},
  year         = {2026},
}
</textarea>
</details></li>
<li><details>
<summary>
(2026). Semiparametric analysis of the additive hazards model with dependent right-censored data. <em>CSTAT</em>, <em>41</em>(1), 1--18. (<a href='https://doi.org/10.1007/s00180-025-01688-1'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {In the researches of censored failure time data, most of them focus on the study which failure time and censored failure time are independent. In practice, there exists a dependent relationship between the failure time and the observation time. If we ignore the relationship, a biased inference process or even wrong conclusion may be drawn. To deal with this, assumed the failure time follows additive hazards model and the dependent censored failure time follows proportional hazards model, and we employ the copula model to describe the relationship between failure time and observation time, then we could get a copula joint model. In order to obtain the parameter estimation, based on spline function approximation and quadratic penalty function, we develop a penalty sieve maximum likelihood estimation of copula joint model. Newton-MI algorithm, which has advantage of solving the positivity constraint of parameters, is used to solve the model parameters. A large number of numerical simulations have verified the good statistical properties of the proposed method. In addition, we apply the proposed method to a ovarian tumor data, an some meaningful conclusions were obtained.},
  archive      = {J_CSTAT},
  author       = {Wang, Shuying and Luo, Linyan and Zhao, Bo and Liu, Xinyu},
  doi          = {10.1007/s00180-025-01688-1},
  journal      = {Computational Statistics},
  month        = {1},
  number       = {1},
  pages        = {1--18},
  shortjournal = {Comput. Stat.},
  title        = {Semiparametric analysis of the additive hazards model with dependent right-censored data},
  volume       = {41},
  year         = {2026},
}
</textarea>
