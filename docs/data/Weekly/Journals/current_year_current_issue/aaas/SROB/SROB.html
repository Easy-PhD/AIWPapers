<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Physical scaling laws predict that miniaturizing robotic mechanisms should enable exceptional robot performance in metrics such as speed and precision. Although these scaling laws have been explored in a variety of microsystems, the benefits and limitations of downscaling three-dimensional (3D) robotic mechanisms have yet to be assessed because of limitations in microscale 3D manufacturing. In this work, we used the Delta robot as a case study for these scaling laws. We present two sizes of 3D-printed Delta robots, the microDeltas, measuring 1.4 and 0.7 millimeters in height, which demonstrate state-of-the-art performance in both size and speed compared with previously reported Delta robots. Printing with two-photon polymerization and subsequent metallization enabled the miniaturization of these 3D robotic parallel mechanisms integrated with electrostatic actuators for achieving high bandwidths. The smallest microDelta was able to operate at more than 1000 hertz and achieved precisions of less than 1 micrometer by taking advantage of its small size. The microDelta’s relatively high output power was demonstrated with the launch of a small projectile, highlighting the utility of miniaturized robotic systems for applications ranging from manufacturing to haptics.},
  archive      = {J_SROB},
  author       = {Steven Man and Sukjun Kim and Sarah Bergbreiter},
  doi          = {10.1126/scirobotics.adx3883},
  journal      = {Science Robotics},
  month        = {11},
  number       = {108},
  pages        = {eadx3883},
  shortjournal = {Sci. Robot.},
  title        = {The microDelta: Downscaling robot mechanisms enables ultrafast and high-precision movement},
  volume       = {10},
  year         = {2025},
}
</textarea>
</details></li>
<li><details>

(2025). Learning a thousand tasks in a day. <em>SROB</em>, <em>10</em>(108), eadv7594. (<a href='https://doi.org/10.1126/scirobotics.adv7594'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Humans are remarkably efficient at learning tasks from demonstrations, but today’s imitation learning methods for robot manipulation often require hundreds or thousands of demonstrations per task. We investigated two fundamental priors for improving learning efficiency: decomposing manipulation trajectories into sequential alignment and interaction phases and retrieval-based generalization. Through 3450 real-world rollouts, we systematically studied this decomposition. We compared different design choices for the alignment and interaction phases and examined generalization and scaling trends relative to today’s dominant paradigm of behavioral cloning with a single-phase monolithic policy. In the few-demonstrations-per-task regime (<10 demonstrations), decomposition achieved an order of magnitude of improvement in data efficiency over single-phase learning, with retrieval consistently outperforming behavioral cloning for both alignment and interaction. Building on these insights, we developed Multi-Task Trajectory Transfer (MT3), an imitation learning method based on decomposition and retrieval. MT3 learns everyday manipulation tasks from as little as a single demonstration each while also generalizing to previously unseen object instances. This efficiency enabled us to teach a robot 1000 distinct everyday tasks in under 24 hours of human demonstrator time. Through 2200 additional real-world rollouts, we reveal MT3’s capabilities and limitations across different task families.},
  archive      = {J_SROB},
  author       = {Kamil Dreczkowski and Pietro Vitiello and Vitalis Vosylius and Edward Johns},
  doi          = {10.1126/scirobotics.adv7594},
  journal      = {Science Robotics},
  month        = {11},
  number       = {108},
  pages        = {eadv7594},
  shortjournal = {Sci. Robot.},
  title        = {Learning a thousand tasks in a day},
  volume       = {10},
  year         = {2025},
}
