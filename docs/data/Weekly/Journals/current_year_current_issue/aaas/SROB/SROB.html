(2025). Artificial embodied circuits uncover neural architectures of vertebrate visuomotor behaviors. <em>SROB</em>, <em>10</em>(107), eadv4408. (<a href='https://doi.org/10.1126/scirobotics.adv4408'>www</a>)

<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Brains evolve within specific sensory and physical environments, yet neuroscience has traditionally focused on studying neural circuits in isolation. Understanding of their function requires integrative brain-body testing in realistic contexts. To investigate the neural and biomechanical mechanisms of sensorimotor transformations, we constructed realistic neuromechanical simulations (simZFish) of the zebrafish optomotor response, a visual stabilization behavior. By computationally reproducing the body mechanics, physical body-water interactions, hydrodynamics, visual environments, and experimentally derived neural network architectures, we closely replicated the behavior of real larval zebrafish. Through systematic manipulation of physiological and circuit connectivity features, impossible in biological experiments, we demonstrate how embodiment shapes neural activity, circuit architecture, and behavior. Changing lens properties and retinal connectivity revealed why the lower posterior visual field drives optimal optomotor responses in the simZFish, explaining receptive field properties observed in real zebrafish. When challenged with novel visual stimuli, the simZFish predicted previously unknown neuronal response types, which we identified via two-photon calcium imaging in the live brains of real zebrafish and incorporated to update the simZFish neural network. In virtual rivers, the simZFish performed rheotaxis autonomously by using current-induced optic flow patterns as navigational cues, compensating for the simulated water flow. Last, experiments with a physical robot (ZBot) validated the role of embodied sensorimotor circuits in maintaining position in a real river with complex fluid dynamics and visual environments. By iterating between simulations, behavioral observations, neural imaging, and robotic testing, we demonstrate the power of integrative approaches to investigating sensorimotor processing, providing insights into embodied neural circuit functions.},
  archive      = {J_SROB},
  author       = {Xiangxiao Liu and Matthew D. Loring and Luca Zunino and Kaitlyn E. Fouke and François A. Longchamp and Alexandre Bernardino and Auke J. Ijspeert and Eva A. Naumann},
  doi          = {10.1126/scirobotics.adv4408},
  journal      = {Science Robotics},
  month        = {10},
  number       = {107},
  pages        = {eadv4408},
  shortjournal = {Sci. Robot.},
  title        = {Artificial embodied circuits uncover neural architectures of vertebrate visuomotor behaviors},
  volume       = {10},
  year         = {2025},
}
</textarea>
</details></li>
<li><details>
<summary>
(2025). Tactile displays driven by projected light. <em>SROB</em>, <em>10</em>(107), eadv1383. (<a href='https://doi.org/10.1126/scirobotics.adv1383'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Tactile displays that lend tangible form to digital content could transform computing interactions. However, achieving the resolution, speed, and dynamic range needed for perceptual fidelity remains challenging. We present a dynamic tactile display that directly converts projected light into visible and tactile patterns via a photomechanical surface populated with millimeter-scale optotactile pixels. The pixels transduce incident light into mechanical displacements through photostimulated thermal gas expansion, yielding millimeter-scale displacements with response times of 2 to 100 milliseconds. The use of projected light for power transmission and addressing renders these displays highly scalable. We demonstrate optically driven displays with up to 1511 addressable pixels, several times more pixels than prior tactile displays attaining comparable performance. Perceptual studies confirm that these displays can reproduce diverse spatiotemporal tactile patterns with high fidelity. This research establishes a foundation for practical and versatile high-resolution tactile displays driven by light.},
  archive      = {J_SROB},
  author       = {Max Linnander and Dustin Goetz and Gregory Reardon and Vijay Kumar and Elliot Hawkes and Yon Visell},
  doi          = {10.1126/scirobotics.adv1383},
  journal      = {Science Robotics},
  month        = {10},
  number       = {107},
  pages        = {eadv1383},
  shortjournal = {Sci. Robot.},
  title        = {Tactile displays driven by projected light},
  volume       = {10},
  year         = {2025},
}
</textarea>
