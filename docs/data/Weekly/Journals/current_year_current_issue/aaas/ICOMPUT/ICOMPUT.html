      if (element.type == "button"){
      element.type="text";

      element.style.color="black";
      element.style.backgroundColor="#C7EDCC";
      element.select();
      element.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(element.value);
      window.getSelection().removeAllRanges();
      element.type="button";
    }

(2025). Improved collaborative filtering for recommendations: Integrating fuzzy clustering and temporal dynamics analysis. <em>ICOMPUT</em>, <em>4</em>, 0188. (<a href='https://doi.org/10.34133/icomputing.0188'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Collaborative filtering plays a vital role in recommendation systems but faces challenges such as data sparsity, scalability, and evolving user preferences. This research introduces an advanced fuzzy clustering method for user categorization that enhances the prediction of user preferences within clusters, even in sparse data scenarios. Our approach can leverage the collective preferences of users within each cluster to generate more accurate recommendations, even when individual user data are limited, to alleviate the data sparsity problem. By limiting similarity assessments to user clusters, our approach improves the scalability of the recommendation algorithm. To address the dynamic nature of user interests, we propose a time decay function that extends the base-level learning function, assigning higher weights to recent ratings for a more accurate representation of current user preferences. The performance of the recommendation algorithm is considerably influenced by the accuracy of the clustering process. Traditional fuzzy clustering methods often prioritize distance during iterations, potentially disregarding the overall consistency of data points, while random initialization of cluster centers can reduce stability and increase susceptibility to noise. We tackle these issues by employing a density-sensitive distance measure for proximity calculations and integrating fuzzy entropy into the clustering process, ensuring global consistency and improving the handling of complex data structures. Moreover, we introduce a mixed-distance approach for selecting initial cluster centers, enhancing the robustness of the clustering algorithm. Experimental results across multiple datasets validate the effectiveness of our proposed method in improving recommendation accuracy and user satisfaction.},
  archive      = {J_ICOMPUT},
  author       = {Senlin Mao and Ji Zhang and Tianzi Zang and Zhao Li and Juan Li},
  doi          = {10.34133/icomputing.0188},
  journal      = {Intelligent Computing},
  month        = {10},
  pages        = {0188},
  shortjournal = {Intell. Comput.},
  title        = {Improved collaborative filtering for recommendations: Integrating fuzzy clustering and temporal dynamics analysis},
  volume       = {4},
  year         = {2025},
}
</textarea>
</details></li>
<li><details>
<summary>
(2025). An intelligent causality analysis system for aviation safety based on nonaxiomatic logic graphs. <em>ICOMPUT</em>, <em>4</em>, 0180. (<a href='https://doi.org/10.34133/icomputing.0180'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {To realize interpretable causality analysis of aviation safety incidents based on aviation safety incident records, a nonaxiomatic causality ontology graph (NACOG) based on nonaxiomatic logic semantics is proposed, and the corresponding construction and updating algorithms for the graph are given. An explicit causality extraction framework is designed to extract causality tuple pairs from aviation safety incident records, and domain ontology mapping is used to eliminate inconsistent descriptions in the extracted pairs. Combined with the inference rules of nonaxiomatic logic and based on the proposed NACOG, a causality analysis algorithm that can infer all potential causes of aviation safety incidents in a new aviation safety incident is presented. Under this NACOG model, a software application is developed, and experimental results based on a real dataset show that, compared with other analysis models, this model has obvious advantages in scalability and interpretability while ensuring the accuracy of analysis results.},
  archive      = {J_ICOMPUT},
  author       = {Yang Jiang and Xingjie Feng and Weigang Huo and Pei Wang},
  doi          = {10.34133/icomputing.0180},
  journal      = {Intelligent Computing},
  month        = {10},

  shortjournal = {Intell. Comput.},
  title        = {An intelligent causality analysis system for aviation safety based on nonaxiomatic logic graphs},
  volume       = {4},
  year         = {2025},
}
