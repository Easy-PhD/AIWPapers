<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {In the realm of networked-loans, it is common for small and medium enterprises (SMEs) to obtain bank loans through guarantor companies. However, during economic downturns, the default of a few firms can trigger a cascade effect within the network, potentially resulting in a comprehensive system collapse. When a firm defaults, its guarantor is contractually required to settle the debt, which may strain the guarantor’s financial health and trigger further defaults across connected firms. This cascading effect can transform isolated financial distress into systemic risk. Therefore, the prediction of firms’ defaults from a comprehensive perspective is vital for ensuring the long-term stability of economic growth. To address this challenge, we propose a temporal graph learning framework that integrates macroeconomic trends and a tailored risk matrix, capturing both external shocks and internal contagion risks. Validated on a large commercial bank dataset with a total loan volume of USD 3 trillion, our system risk dynamic prediction (SRDP) method achieves 88.3% area under curve (AUC), considerably outperforming the state-of-the-art baselines. Risk mitigation analysis reveals that targeting the top 1% of predicted high-risk nodes reduces systemic risk exposure by an average of 25%, with heightened efficacy during financial crises and market volatility phases. The proposed method empowers financial regulators and risk managers with enhanced capabilities to monitor and grasp risks embedded within networked-loans against systemic financial crises.},
  archive      = {J_ICOMPUT},
  author       = {Moyang Liu and Taijun Li and Junqi Chen and Zhibin Niu and Jiawan Zhang},
  doi          = {10.34133/icomputing.0193},
  journal      = {Intelligent Computing},
  month        = {11},
  pages        = {0193},
  shortjournal = {Intell. Comput.},
  title        = {Temporal graph learning for default prediction and systemic risk mitigation in financial networks},
  volume       = {4},
  year         = {2025},
}
</textarea>
</details></li>

<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {In recent years, the rapid advancement of space technologies has given rise to sophisticated space computing systems, which have become crucial for various applications such as Earth observation, communication, and scientific research. This survey paper provides a comprehensive overview of the history, current state, and future trends in space computing systems. We discuss the evolution of these systems, highlighting important milestones from early satellite communication networks to modern space–air–ground integrated networks (SAGIN). Despite their advancements, space computing systems face numerous challenges, including resource constraints and unstable network links. To address these challenges, we explore key enabling technologies that are critical for the future of space computing. These include virtualization and resource pooling, which enhance resource utilization; distributed storage, which provides resilience and efficiency; advanced scheduling and orchestration techniques, which optimize task allocation across heterogeneous resources; collaborative AI training and inference, which leverage distributed satellite networks for real-time data processing; and robust security and privacy measures, which are vital for safeguarding sensitive information in space operations. By examining existing systems and identifying open research challenges, this paper aims to provide a road map for future research and development in the field of space computing systems. Our findings highlight the potential of emerging technologies to transform space operations and underscore the importance of continued innovation in overcoming current limitations.},
  archive      = {J_ICOMPUT},

  pages        = {0134},
  shortjournal = {Intell. Comput.},
  title        = {Space computing: Architectures, challenges, and future directions},

}
