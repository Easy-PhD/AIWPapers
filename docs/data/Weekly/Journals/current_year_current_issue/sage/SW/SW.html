<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Integrating Schema.org markup into web pages has resulted in the generation of billions of RDF triples. However, around 75% of web pages still lack this critical markup. Large language models (LLMs) present a promising solution by automatically generating the missing Schema.org markup. Despite this potential, there is currently no benchmark to evaluate the markup quality produced by LLMs. This article introduces LLM4Schema.org, an innovative approach for assessing the performance of LLMs in generating Schema.org markup. Unlike traditional methods, LLM4Schema.org does not require a predefined ground truth. Instead, it compares the quality of LLM-generated markup against human-generated markup. Our findings reveal that 40%–50% of the markup produced by GPT-3.5 and GPT-4 is invalid, non-factual, or non-compliant with the Schema.org ontology. These errors underscore the limitations of LLMs in adhering strictly to structured ontologies like Schema.org without additional filtering and validation mechanisms. We demonstrate that specialized LLM-powered agents can effectively identify and eliminate these errors. After applying such filtering for both human and LLM-generated markup, GPT-4 shows notable improvements in quality and outperforms humans. LLM4Schema.org highlights both the potential and the challenges of leveraging LLMs for semantic annotations, emphasizing the critical role of careful curation and validation to achieve reliable results.},
  archive      = {J_SW},
  author       = {Minh-Hoang Dang and Thi Hoang Thi Pham and Pascal Molli and Hala Skaf-Molli and Alban Gaignard},
  doi          = {10.1177/22104968251382172},
  journal      = {Semantic Web},
  month        = {11},
  number       = {6},
  shortjournal = {Semantic Web},
  title        = {LLM4Schema.org: Generating schema.org markups with large language models},
  volume       = {16},
  year         = {2025},
}
</textarea>
</details></li>
<li><details>

(2025). An abduction-based method for explaining non-entailments of semantic matching. <em>SW</em>, <em>16</em>(6). (<a href='https://doi.org/10.1177/22104968251386880'>www</a>)
</summary>
<textarea id="copyID" onclick="copy(this)" rows="16" cols="145">
@article{ ,
  abstract     = {Explainable artificial intelligence (XAI) attempts to give explanations for decisions made by AI systems. Despite the fact that for knowledge-based systems this is perceived as inherently easier than for black-box AI systems based on Machine Learning, research is still required for computing satisfactory explanations of reasoning results. In this article, we focus on explaining non-entailments as a result of semantic matching in E L ⊥ ontologies. In the cases where the result of semantic matching is an entailment, the already established methods of justifications and proofs provide excellent results. On the other hand, the cases in which the result of semantic matching presents in the form of a non-entailment demand an alternative approach. Inspired by abductive reasoning techniques, we present a method for computing subtree isomorphisms between graphical representations of E L ⊥ concept descriptions, which are then used to construct solutions to abduction problems, that is, explanations, for semantic matching non-entailments in E L ⊥ ontologies. We improve existing results by generalizing our approach to be able to abduct complex concept expressions of all formats that also consist of role restrictions, rather than concepts alone, as well as the time needed to compute solutions to abduction problems in E L ⊥ ontologies. We then illustrate our method with an example scenario and perform synthetic experiments to stress the methods’ capabilities and experiments on realistic ontologies to show the practical performance of our method.},
  archive      = {J_SW},
  author       = {Ivan Gocev and Georgios Meditskos and Nick Bassiliades},
  doi          = {10.1177/22104968251386880},
  journal      = {Semantic Web},
  month        = {11},
  number       = {6},
  shortjournal = {Semantic Web},
  title        = {An abduction-based method for explaining non-entailments of semantic matching},
  volume       = {16},
  year         = {2025},
}
</textarea>
